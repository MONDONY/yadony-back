worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Compression des reponses texte : JSON de l'API (listes 5 a 10 fois plus legeres
    # sur reseau mobile), JS/CSS/SVG de l'admin et du site. Rien n'etait compresse
    # (verifie le 2026-10-04 en staging et en prod). text/html est toujours inclus.
    # Une reponse deja compressee par l'amont (Content-Encoding) n'est pas retouchee.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    #
    # Le quota se compte par IP ($binary_remote_addr), pas par compte : derriere
    # le CGNAT d'un operateur mobile (Orange, MTN, Free, Moov...), des centaines
    # d'abonnes distincts partagent une meme adresse publique et donc un meme
    # quota. nginx ne garde donc qu'un plafond ANTI-FLOOD large. Les vraies
    # limites sont dans l'application (ratelimit/RateLimitRule) : par compte
    # (uid Firebase) pour tout ce qui est authentifie, et pour l'OTP par adresse,
    # par numero, par IP et en budget global (services emailotp/ et smsotp/).
    #
    # X-Forwarded-For est ECRASE par $remote_addr (pas complete) : Spring
    # (forward-headers-strategy: framework) prend la premiere valeur de
    # l'en-tete comme IP client, et $proxy_add_x_forwarded_for la laissait au
    # choix du client. Seul ce nginx est expose, l'IP qu'il voit fait foi.
    #
    # API generale : 600 req/min par IP (10/s), reserve de 200. Un bloc CGNAT
    # de plusieurs dizaines d'utilisateurs actifs y tient ; un flood non.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;
    #
    # Auth et KYC : 60 req/min par IP, reserve de 30. Ne reste ici que ce qui
    # est appele avant connexion ou facture a l'appel (inscription, OTP, KYC).
    # La protection reelle porte sur l'identite (5 essais par adresse, 5 envois
    # par fenetre, budgets globaux, pays SMS autorises) et sur l'IP cote
    # application (OTP_SEND_IP, OTP_VERIFY_IP) : nginx n'est qu'un filet.
    limit_req_zone $binary_remote_addr zone=api_sensitive:10m rate=60r/m;
    # Saisie d'un code de recharge du solde : chaque code valide crédite un solde, la
    # répétition est une force brute. 20 req/min par IP (CGNAT), en plus des compteurs
    # d'échecs du back (compte, IP, global).
    limit_req_zone $binary_remote_addr zone=wallet_code_redeem:1m rate=20r/m;
    # Outils admin (Grafana/Kuma) : SPA qui tirent des dizaines de requetes
    # par chargement de page, api_general (pensee pour l'appli mobile) les
    # faisait passer en 429 des la connexion.
    limit_req_zone $binary_remote_addr zone=admin_tools:10m rate=300r/m;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.yadony.com yadony.com www.yadony.com admin.yadony.com pro.yadony.com prod.yadony.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS public static assets ───────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        # prod.yadony.com est le nom public du VPS pour tout ce qui n'est pas
        # l'espace pro : back-office /siragbe/, suivi de colis, affiches de
        # trajet et de demande, pages legales. C'est la cible des redirections
        # de yadony.com (yadony-web/public/_redirects). Il n'etait declare dans
        # aucun server_name et n'etait donc servi que parce que ce bloc est le
        # premier en 443, donc le serveur par defaut : le jour ou un bloc passe
        # devant, prod.yadony.com atterrit ailleurs sans que rien ne le signale.
        # Il arrive proxifie par Cloudflare, qui termine le TLS cote visiteur ;
        # le certificat presente ici reste celui de yadony.com.
        server_name yadony.com www.yadony.com prod.yadony.com;

        ssl_certificate     /etc/letsencrypt/live/yadony.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yadony.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        resolver 127.0.0.11 valid=10s ipv6=off;
        # Le vhost du portail ne déclarait que l'API : ni dony-pro ni le
        # back-office n'avaient de backend, donc aucun des deux n'était
        # joignable en production.
        set $backend       http://api:8080;
        set $pro_backend   http://yadony_pro:3000;
        set $admin_backend http://yadony_admin:3000;

        location = /logo.png {
            alias /var/www/static/logo.png;
            default_type image/png;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        location /pro/ {
            return 301 https://pro.yadony.com$request_uri;
        }

        # Le conteneur yadony_admin tournait sans aucune route nginx : le
        # back-office était injoignable de l'extérieur. Son healthcheck
        # interroge /siragbe/, c'est le préfixe attendu par l'application.
        location /siragbe/ {
            proxy_pass         $admin_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public parcel tracking page shared with recipients.
        location ~ ^/tracking/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/tracking/public/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/tracking/([A-Za-z0-9-]+)/status$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/tracking/public/$1/status;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public trip poster page, shared by travelers on Facebook/WhatsApp/TikTok.
        # Mirrors the tracking rule above: the pretty external path is rewritten
        # to the backend's own short alias (/annonce/{id}, permitAll in
        # SecurityConfig — see PublicAnnouncementPageController).
        location ~ ^/annonce/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/annonce/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public package request page, shared by senders on Facebook/WhatsApp.
        # Symmetric to the /annonce/ rule above: the pretty external path is
        # rewritten to the backend's own short alias (/demande/{id}, permitAll
        # in SecurityConfig — see PublicPackageRequestPageController).
        location ~ ^/demande/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/demande/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/v1/ratings/recipient {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Pages légales servies en statique. Les URL /legal/terms et
        # /legal/privacy sont câblées en dur dans le routeur de l'application
        # et renvoyaient 404 : ni les CGU ni la politique de confidentialité
        # n'étaient accessibles, y compris pour les revues App Store et Play.
        # `expires` plutôt qu'`add_header Cache-Control` : un add_header ici
        # remplacerait ceux du serveur et ferait sauter HSTS et compagnie.
        location = /legal/terms {
            alias /var/www/static/legal/terms.html;
            default_type text/html;
            expires 5m;
        }

        location = /legal/privacy {
            alias /var/www/static/legal/privacy.html;
            default_type text/html;
            expires 5m;
        }

        location = /legal/account-deletion {
            alias /var/www/static/legal/account-deletion.html;
            default_type text/html;
            expires 5m;
        }

        location = /legal/_style.css {
            alias /var/www/static/legal/_style.css;
            default_type text/css;
            expires 5m;
        }

        # Garde-fou anti-boucle. Le site vitrine (Cloudflare Pages) redirige
        # /api/*, /tracking/*, /annonce/* et /demande/* vers ce vhost
        # (yadony-web/public/_redirects). Un chemin de cette forme qu'aucune
        # regle ci-dessus n'a capte tomberait dans le catch-all plus bas, qui
        # le renvoie au site vitrine, qui le redirige ici de nouveau : boucle
        # infinie. On repond 404, comme le faisait l'ancien vhost du portail.
        # Place apres les regex de /tracking/, /annonce/ et /demande/ : entre
        # regex, nginx retient la premiere qui correspond, dans l'ordre du
        # fichier. /siragbe/ est volontairement absent : c'est une location
        # prefixe, qu'une regex correspondante supplanterait, et le back-office
        # deviendrait injoignable.
        location ~ ^/(api|tracking|annonce|demande)(/|$) {
            return 404;
        }

        # Pas encore de site vitrine : redirige vers /pro/, comme le fait
        # déjà le portail en place. Sans cela, yadony.com renverrait 404.
        location = / {
            return 302 https://yadony-web.pages.dev/;
        }

        # Transition DNS : les visiteurs dont le cache pointe encore ici
        # sont renvoyes vers le site vitrine, chemin conserve.
        location / {
            return 302 https://yadony-web.pages.dev$request_uri;
        }
    }

    # ── HTTPS pro.yadony.com (copie du bloc yadony.com : fusionner ici et
    #    supprimer le bloc yadony.com/www une fois la racine basculée sur
    #    Cloudflare Pages) ───────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name pro.yadony.com;

        ssl_certificate     /etc/letsencrypt/live/pro.yadony.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pro.yadony.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        resolver 127.0.0.11 valid=10s ipv6=off;
        # Le vhost du portail ne déclarait que l'API : ni dony-pro ni le
        # back-office n'avaient de backend, donc aucun des deux n'était
        # joignable en production.
        set $backend       http://api:8080;
        set $pro_backend   http://yadony_pro:3000;
        set $admin_backend http://yadony_admin:3000;

        location = /logo.png {
            alias /var/www/static/logo.png;
            default_type image/png;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        location /pro/ {
            proxy_pass         $pro_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Le conteneur yadony_admin tournait sans aucune route nginx : le
        # back-office était injoignable de l'extérieur. Son healthcheck
        # interroge /siragbe/, c'est le préfixe attendu par l'application.
        location /siragbe/ {
            proxy_pass         $admin_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public parcel tracking page shared with recipients.
        location ~ ^/tracking/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/tracking/public/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/tracking/([A-Za-z0-9-]+)/status$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/tracking/public/$1/status;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public trip poster page, shared by travelers on Facebook/WhatsApp/TikTok.
        # Mirrors the tracking rule above: the pretty external path is rewritten
        # to the backend's own short alias (/annonce/{id}, permitAll in
        # SecurityConfig — see PublicAnnouncementPageController).
        location ~ ^/annonce/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/annonce/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public package request page, shared by senders on Facebook/WhatsApp.
        # Symmetric to the /annonce/ rule above: the pretty external path is
        # rewritten to the backend's own short alias (/demande/{id}, permitAll
        # in SecurityConfig — see PublicPackageRequestPageController).
        location ~ ^/demande/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/demande/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/v1/ratings/recipient {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Pages légales servies en statique. Les URL /legal/terms et
        # /legal/privacy sont câblées en dur dans le routeur de l'application
        # et renvoyaient 404 : ni les CGU ni la politique de confidentialité
        # n'étaient accessibles, y compris pour les revues App Store et Play.
        # `expires` plutôt qu'`add_header Cache-Control` : un add_header ici
        # remplacerait ceux du serveur et ferait sauter HSTS et compagnie.
        location = /legal/terms {
            alias /var/www/static/legal/terms.html;
            default_type text/html;
            expires 5m;
        }

        location = /legal/privacy {
            alias /var/www/static/legal/privacy.html;
            default_type text/html;
            expires 5m;
        }

        location = /legal/account-deletion {
            alias /var/www/static/legal/account-deletion.html;
            default_type text/html;
            expires 5m;
        }

        location = /legal/_style.css {
            alias /var/www/static/legal/_style.css;
            default_type text/css;
            expires 5m;
        }

        # Pas encore de site vitrine : redirige vers /pro/, comme le fait
        # déjà le portail en place. Sans cela, yadony.com renverrait 404.
        location = / {
            return 302 /pro/;
        }

        location / {
            return 404;
        }
    }

    # ── HTTPS main server ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name api.yadony.com;

        ssl_certificate     /etc/letsencrypt/live/api.yadony.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yadony.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 15M;

        # Docker internal DNS resolver — defers upstream resolution so nginx -t passes
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8080;

        # Logo des pages publiques servies par le back sur ce domaine (scan du QR
        # collé sur le colis, suivi destinataire) : <img src="/logo.png">. Sans
        # cette règle, /logo.png partait vers le back et répondait 404.
        location = /logo.png {
            alias /var/www/static/logo.png;
            default_type image/png;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # ── Device registration: general rate ────────────────────────────────
        # Cet endpoint n'est sensible que par son préfixe /auth. Il enregistre
        # le jeton push d'un appareil, opération que l'application rejoue à
        # chaque reprise au premier plan. À 5 req/min il était rejeté en 429,
        # l'appareil n'était jamais enregistré et ne recevait plus aucune
        # notification. Une correspondance exacte prime sur les regex ci-dessous,
        # quel que soit l'ordre de déclaration.
        location = /api/v1/auth/me/fcm-token {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Endpoints de profil : lecture et ecriture courantes, que l'application
        # rejoue a chaque reprise au premier plan et apres chaque action qui
        # modifie le compte (sept points du code declenchent un rafraichissement
        # de profil). Ils partagent le prefixe /auth mais n'ont rien de sensible
        # au sens anti-force-brute : aucun secret ne s'y devine par repetition.
        # Les laisser a 5 req/min renvoyait des 429 en usage normal — l'ecran
        # affichait « tu as fait trop d'appels en peu de temps » apres quelques
        # secondes de navigation. Meme cause et meme correctif que fcm-token
        # ci-dessus, generalises a /auth/me et ses sous-chemins.
        #
        # Declare AVANT la regex sensible : a egalite de type, nginx retient la
        # premiere expression reguliere qui correspond, dans l'ordre du fichier.
        location ~ ^/api/v1/auth/me(/|$) {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Webhook Stripe Identity : meme raison que Didit ci-dessous. Il tombait dans la
        # regex sensible (auth|kyc) et ses rafales pouvaient prendre un 429. La signature
        # Stripe-Signature l'authentifie ; Stripe rejoue, mais avec retard.
        location = /api/v1/kyc/webhook {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;
            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Webhook Didit ────────────────────────────────────────────────────
        # Match exact, donc prioritaire sur la regex sensible ci-dessous. Tous les
        # evenements arrivent d'une poignee d'IP Didit : la limite sensible serait
        # atteinte des que plusieurs verifications aboutissent en meme temps. Or Didit
        # ne rejoue QUE sur 5xx, 404 et timeout — un 429 perdrait l'evenement en
        # silence, et un KYC reussi resterait PENDING pour toujours. La signature HMAC
        # porte l'authentification, le debit n'y ajoute rien.
        location = /api/v1/kyc/webhook/didit {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Sensitive endpoints: 60 req/min par IP ────────────────────────────
        # Ne restent ici que les points d'entree ou la repetition est une
        # attaque : inscription, envoi et verification de codes OTP,
        # reclamation d'un compte invite, et tout le KYC.
        location ~ ^/api/v1/(auth|kyc) {
            limit_req zone=api_sensitive burst=30 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Code de recharge du solde : 20 req/min par IP ────────────────────
        location = /api/v1/wallet/topup-codes/redeem {
            limit_req zone=wallet_code_redeem burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── General API: 600 req/min par IP ──────────────────────────────────
        location /api/v1/ {
            limit_req zone=api_general burst=200 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Health check (no rate limit) ─────────────────────────────────────
        location /api/v1/actuator/health {
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        # Actuator : seul /health est public, le reste est bloqué
        location /api/v1/actuator/ {
            return 404;
        }

        # Block everything else
        location / {
            return 404;
        }
    }
    # ── Admin tools (Uptime Kuma) — sous-domaine dedie, jamais indexe ───────
    server {
        listen 443 ssl;
        http2  on;
        server_name admin.yadony.com;

        ssl_certificate     /etc/letsencrypt/live/admin.yadony.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.yadony.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $uptime_kuma_backend http://yadony_uptime_kuma:3001;
        set $grafana_backend     http://yadony_grafana:3000;

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /uptime {
            return 301 /uptime/;
        }

        # Uptime Kuma ne supporte pas de base path natif : on proxy /uptime/
        # en retirant le prefixe (l'app croit tourner a la racine), et la
        # racine reste aussi mappee vers Kuma car ses assets/websocket sont
        # references en chemin absolu depuis la racine du domaine.
        location /uptime/ {
            limit_req zone=admin_tools burst=120 nodelay;
            limit_req_status 429;

            proxy_pass         $uptime_kuma_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        # Grafana supporte nativement un base path (GF_SERVER_SERVE_FROM_SUB_PATH),
        # contrairement a Kuma : le prefixe /grafana/ n'est PAS retire.
        location /grafana/ {
            limit_req zone=admin_tools burst=120 nodelay;
            limit_req_status 429;

            proxy_pass         $grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=admin_tools burst=120 nodelay;
            limit_req_status 429;

            proxy_pass         $uptime_kuma_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Uptime Kuma utilise socket.io (WebSocket) pour le live dashboard
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
