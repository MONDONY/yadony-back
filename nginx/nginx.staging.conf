worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_sensitive:10m rate=5r/m;

    server {
        listen 80;
        server_name api-staging.yadony.com staging.yadony.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2  on;
        server_name staging.yadony.com;

        ssl_certificate     /etc/letsencrypt/live/staging.yadony.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.yadony.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Aucun moteur ne doit indexer la recette. L'en-tête couvre toutes
        # les réponses du vhost, y compris celles proxifiées vers Nuxt ou
        # l'API, que robots.txt seul ne protégerait pas d'un lien entrant.
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        location = /robots.txt {
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        client_max_body_size 5M;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pro_backend   http://yadony_pro:3000;
        set $admin_backend http://yadony_admin:3000;
        set $backend       http://api:8080;

        location = /logo.png {
            alias /var/www/static/logo.png;
            default_type image/png;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
            access_log off;
        }

        location /pro/ {
            proxy_pass         $pro_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Le conteneur yadony_admin tournait sans aucune route nginx : le
        # back-office était injoignable de l'extérieur. Son healthcheck
        # interroge /siragbe/, c'est le préfixe attendu par l'application.
        location /siragbe/ {
            proxy_pass         $admin_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/tracking/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/tracking/public/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/tracking/([A-Za-z0-9-]+)/status$ {
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/tracking/public/$1/status;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Public trip poster page, shared by travelers on Facebook/WhatsApp/TikTok.
        # Mirrors the tracking rule above: the pretty external path is rewritten
        # to the backend's own short alias (/annonce/{id}, permitAll in
        # SecurityConfig — see PublicAnnouncementPageController).
        location ~ ^/annonce/([A-Za-z0-9-]+)$ {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         $backend/api/v1/annonce/$1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /api/v1/ratings/recipient {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Pas encore de site vitrine — redirige vers /pro/ en attendant.
        location = / {
            return 302 /pro/;
        }
    }

    server {
        listen 443 ssl;
        http2  on;
        server_name api-staging.yadony.com;

        ssl_certificate     /etc/letsencrypt/live/api-staging.yadony.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api-staging.yadony.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Aucun moteur ne doit indexer la recette. L'en-tête couvre toutes
        # les réponses du vhost, y compris celles proxifiées vers Nuxt ou
        # l'API, que robots.txt seul ne protégerait pas d'un lien entrant.
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        location = /robots.txt {
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        client_max_body_size 15M;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8080;

        location = /logo.png {
            alias /var/www/static/logo.png;
            default_type image/png;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
            access_log off;
        }

        # Cet endpoint n'est sensible que par son préfixe /auth. Il enregistre
        # le jeton push d'un appareil, opération que l'application rejoue à
        # chaque reprise au premier plan. À 5 req/min il était rejeté en 429,
        # l'appareil n'était jamais enregistré et ne recevait plus aucune
        # notification. Une correspondance exacte prime sur les regex ci-dessous,
        # quel que soit l'ordre de déclaration.
        location = /api/v1/auth/me/fcm-token {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;
            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/(auth|kyc) {
            limit_req zone=api_sensitive burst=3 nodelay;
            limit_req_status 429;
            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/v1/ {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;
            proxy_pass         $backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/v1/actuator/health {
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        # Actuator : seul /health est public, le reste est bloqué
        location /api/v1/actuator/ {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
