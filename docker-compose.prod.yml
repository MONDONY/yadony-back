services:
  api:
    image: ghcr.io/mondony/yadony-back:${YADONY_IMAGE_TAG:-latest}
    container_name: yadony_api
    restart: unless-stopped
    # Toutes les variables (secrets inclus) vivent dans le .env à côté de ce
    # fichier : une variable ajoutée au .env atteint le conteneur sans toucher
    # au compose. Les entrées environment: ne gardent que le non-secret figé.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yadony_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: yadony_alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      YADONY_ENV: prod
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - yadony_alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - yadony_internal
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: yadony_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - yadony_prometheus_data:/prometheus
    networks:
      - yadony_internal
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: yadony_alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - yadony_alertmanager_data:/alertmanager
    networks:
      - yadony_internal
    depends_on:
      - discord-alerts

  discord-alerts:
    image: rogerrum/alertmanager-discord:latest
    container_name: yadony_discord_alerts
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL}
      LISTEN_ADDRESS: 0.0.0.0:9094
    networks:
      - yadony_internal

  db:
    image: postgres:16-alpine
    container_name: yadony_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: yadony_prod
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - yadony_db_prod_data:/var/lib/postgresql/data
    # Aucun port exposé — accessible uniquement via le réseau interne Docker
    networks:
      - yadony_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d yadony_prod"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16-alpine
    container_name: yadony_db_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    networks:
      - yadony_internal
    # Backup immédiat au démarrage, puis toutes les 24h. Keep last 7 days.
    entrypoint: >
      sh -c "
        backup() {
          FILE=/backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
          pg_dump -h db -U ${DB_USERNAME} yadony_prod | gzip > $$FILE;
          echo \"Backup created: $$FILE\";
          find /backups -name 'backup_*.sql.gz' -mtime +7 -delete;
        };
        backup;
        while true; do sleep 86400 & wait $$!; backup; done
      "
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: yadony_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - yadony_internal

volumes:
  yadony_db_prod_data:
  yadony_alloy_data:
  yadony_prometheus_data:
  yadony_alertmanager_data:

networks:
  yadony_internal:
    driver: bridge
