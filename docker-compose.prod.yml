services:
  api:
    image: ghcr.io/mondony/yadony-back:${YADONY_IMAGE_TAG:-latest}
    container_name: yadony_api
    restart: unless-stopped
    # Toutes les variables (secrets inclus) vivent dans le .env à côté de ce
    # fichier : une variable ajoutée au .env atteint le conteneur sans toucher
    # au compose. Les entrées environment: ne gardent que le non-secret figé.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yadony_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: yadony_alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      YADONY_ENV: prod
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - yadony_alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - yadony_internal
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: yadony_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: yadony_prod
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - yadony_db_prod_data:/var/lib/postgresql/data
    # Aucun port exposé — accessible uniquement via le réseau interne Docker
    networks:
      - yadony_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d yadony_prod"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16-alpine
    container_name: yadony_db_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    networks:
      - yadony_internal
    # Backup immédiat au démarrage, puis toutes les 24h. Keep last 7 days.
    entrypoint: >
      sh -c "
        backup() {
          FILE=/backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
          pg_dump -h db -U ${DB_USERNAME} yadony_prod | gzip > $$FILE;
          echo \"Backup created: $$FILE\";
          find /backups -name 'backup_*.sql.gz' -mtime +7 -delete;
        };
        backup;
        while true; do sleep 86400 & wait $$!; backup; done
      "
    depends_on:
      db:
        condition: service_healthy

  # Sans ce service, les certificats de production expiraient sans jamais
  # être renouvelés : le compose prod n'en déclarait aucun, alors que le
  # compose staging en a un depuis le début.
  certbot:
    image: certbot/certbot:latest
    container_name: yadony_certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: >
      sh -c "
        certbot certonly --webroot -w /var/www/certbot -d api.yadony.com --non-interactive --agree-tos --email ops@yadony.com --keep-until-expiring --quiet;
        certbot certonly --webroot -w /var/www/certbot -d yadony.com -d www.yadony.com --non-interactive --agree-tos --email ops@yadony.com --keep-until-expiring --quiet;
        while true; do
          sleep 86400 &
          wait $$!
          certbot renew --webroot -w /var/www/certbot --quiet
        done
      "
    depends_on:
      - nginx

  nginx:
    image: nginx:1.27-alpine
    container_name: yadony_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/static:/var/www/static:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - yadony_internal

volumes:
  yadony_db_prod_data:
  yadony_alloy_data:

networks:
  yadony_internal:
    driver: bridge
