name: Deploy Staging

# Déploiement staging sur liste blanche : seules les branches préfixées
# `staging/` partent sur le VPS. L'ancien filtre était `branches-ignore: [main]`,
# c'est-à-dire « tout sauf main » : n'importe quelle branche de travail qui
# passait la CI déployait son image ET appliquait ses migrations Flyway à la base
# staging. Le 2026-08-15, V207 (renommage + DROP COLUMN) est ainsi partie depuis
# une branche feature ; un déploiement ultérieur a remis l'image de `main`, dont
# le code cherchait encore l'ancienne colonne → Schema-validation en échec,
# crash-loop et 502 pendant une heure.
#
# Pour tester une branche en staging, la nommer `staging/<sujet>` (ou pousser un
# alias : `git push origin ma-branche:staging/ma-branche`). Le déploiement
# redevient ainsi un acte volontaire, migrations comprises.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ['staging/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mondony/yadony-back

jobs:

  check-ci:
    name: Vérification CI
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.extract.outputs.branch }}
    steps:
      - name: Extraire la branche
        id: extract
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "🔍 Workflow CI sur la branche: $BRANCH"
      - name: La CI a-t-elle réussi ?
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI échouée — déploiement bloqué"
            exit 1
          fi
          echo "✅ CI validée — déploiement autorisé"

  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Métadonnées image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short,enable=true
            type=raw,value=staging
      - name: Build & Push vers GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Déploiement Staging
    runs-on: ubuntu-latest
    needs: [check-ci, build-push]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Valider les secrets critiques
        run: |
          if [ -z "${{ secrets.OVH_HOST }}" ]; then
            echo "❌ Secret manquant: OVH_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.OVH_USER }}" ]; then
            echo "❌ Secret manquant: OVH_USER"
            exit 1
          fi
          if [ -z "${{ secrets.OVH_SSH_KEY }}" ]; then
            echo "❌ Secret manquant: OVH_SSH_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.GHCR_USERNAME }}" ]; then
            echo "❌ Secret manquant: GHCR_USERNAME"
            exit 1
          fi
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "❌ Secret manquant: GHCR_PAT"
            exit 1
          fi
          if [ -z "${{ secrets.DB_USERNAME }}" ]; then
            echo "❌ Secret manquant: DB_USERNAME"
            exit 1
          fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "❌ Secret manquant: DB_PASSWORD"
            exit 1
          fi
          echo "✅ Tous les secrets critiques sont présents"

      - name: Créer .env.staging depuis les secrets et variables
        run: |
          cat > .env.staging << 'EOF'
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_WEBHOOK_PAYMENTS_SECRET=${{ secrets.STRIPE_WEBHOOK_PAYMENTS_SECRET }}
          STRIPE_WEBHOOK_KYC_SECRET=${{ secrets.STRIPE_WEBHOOK_KYC_SECRET }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
          AWS_S3_ENDPOINT=${{ secrets.AWS_S3_ENDPOINT }}
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}
          GRAFANA_PROM_URL=${{ secrets.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER=${{ secrets.GRAFANA_PROM_USER }}
          GRAFANA_LOKI_URL=${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER=${{ secrets.GRAFANA_LOKI_USER }}
          GRAFANA_CLOUD_TOKEN=${{ secrets.GRAFANA_CLOUD_TOKEN }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          INTERNAL_SHARED_SECRET=${{ secrets.INTERNAL_SHARED_SECRET }}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          AT_API_KEY=${{ secrets.AT_API_KEY }}

          # Config métier (non sensible) — modifiable dans Settings > Environments > staging > Variables
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          APP_BASE_URL=${{ vars.APP_BASE_URL }}
          STORAGE_PUBLIC_BASE_URL=${{ vars.STORAGE_PUBLIC_BASE_URL }}
          SWAGGER_ENABLED=${{ vars.SWAGGER_ENABLED }}
          SMS_ENABLED=${{ vars.SMS_ENABLED }}
          AT_USERNAME=${{ vars.AT_USERNAME }}
          TWILIO_FROM=${{ vars.TWILIO_FROM }}
          WAVE_API_URL=${{ vars.WAVE_API_URL }}
          ORANGE_MONEY_API_URL=${{ vars.ORANGE_MONEY_API_URL }}
          YADONY_COMMISSION_RATE=${{ vars.YADONY_COMMISSION_RATE }}
          YADONY_COMMISSION_MINIMUM_AMOUNT=${{ vars.YADONY_COMMISSION_MINIMUM_AMOUNT }}
          YADONY_COMMISSION_NO_SHOW_CONTESTATION_HOURS=${{ vars.YADONY_COMMISSION_NO_SHOW_CONTESTATION_HOURS }}
          YADONY_URGENCY_THRESHOLD_DAYS=${{ vars.YADONY_URGENCY_THRESHOLD_DAYS }}
          YADONY_LIMITS_NON_PRO_MONTHLY_ANNOUNCEMENTS=${{ vars.YADONY_LIMITS_NON_PRO_MONTHLY_ANNOUNCEMENTS }}
          YADONY_ESCROW_TIMEOUT_HOURS=${{ vars.YADONY_ESCROW_TIMEOUT_HOURS }}
          YADONY_DISPUTE_SLA_HOURS=${{ vars.YADONY_DISPUTE_SLA_HOURS }}
          YADONY_REIMBURSEMENT_MAX_AMOUNT_EUR=${{ vars.YADONY_REIMBURSEMENT_MAX_AMOUNT_EUR }}
          YADONY_KYC_RETURN_URL=${{ vars.YADONY_KYC_RETURN_URL }}
          YADONY_STRIPE_CONNECT_BUSINESS_URL=${{ vars.YADONY_STRIPE_CONNECT_BUSINESS_URL }}
          YADONY_REFERRAL_REWARD_AMOUNT_CENTS=${{ vars.YADONY_REFERRAL_REWARD_AMOUNT_CENTS }}
          YADONY_REFERRAL_MAX_INVITATIONS_PER_USER=${{ vars.YADONY_REFERRAL_MAX_INVITATIONS_PER_USER }}
          YADONY_REFERRAL_CODE_REGENERATION_COOLDOWN_DAYS=${{ vars.YADONY_REFERRAL_CODE_REGENERATION_COOLDOWN_DAYS }}
          YADONY_REQUESTS_MAX_NEGOTIATION_ROUNDS=${{ vars.YADONY_REQUESTS_MAX_NEGOTIATION_ROUNDS }}
          YADONY_REQUESTS_THREAD_INACTIVITY_HOURS=${{ vars.YADONY_REQUESTS_THREAD_INACTIVITY_HOURS }}
          YADONY_REQUESTS_AWAITING_TRIP_HOURS=${{ vars.YADONY_REQUESTS_AWAITING_TRIP_HOURS }}
          YADONY_REQUESTS_AWAITING_PAYMENT_HOURS=${{ vars.YADONY_REQUESTS_AWAITING_PAYMENT_HOURS }}
          YADONY_REQUESTS_DATE_TOLERANCE_DEFAULT_DAYS=${{ vars.YADONY_REQUESTS_DATE_TOLERANCE_DEFAULT_DAYS }}
          YADONY_REQUESTS_DATE_TOLERANCE_MAX_DAYS=${{ vars.YADONY_REQUESTS_DATE_TOLERANCE_MAX_DAYS }}
          YADONY_REQUESTS_WEIGHT_KG_MIN=${{ vars.YADONY_REQUESTS_WEIGHT_KG_MIN }}
          YADONY_REQUESTS_WEIGHT_KG_MAX=${{ vars.YADONY_REQUESTS_WEIGHT_KG_MAX }}
          YADONY_NEGOTIATION_COMMISSION_WINDOW_MINUTES=${{ vars.YADONY_NEGOTIATION_COMMISSION_WINDOW_MINUTES }}
          YADONY_NEGOTIATION_COMMISSION_REFUND_SWEEP_DAYS=${{ vars.YADONY_NEGOTIATION_COMMISSION_REFUND_SWEEP_DAYS }}
          YADONY_NEGOTIATION_COMMISSION_EXPIRE_CRON=${{ vars.YADONY_NEGOTIATION_COMMISSION_EXPIRE_CRON }}
          YADONY_REQUESTS_BODY_MAX_CHARS=${{ vars.YADONY_REQUESTS_BODY_MAX_CHARS }}
          YADONY_REQUESTS_MAX_OPEN_REQUESTS_PER_SENDER=${{ vars.YADONY_REQUESTS_MAX_OPEN_REQUESTS_PER_SENDER }}
          YADONY_REQUESTS_MAX_OPEN_THREADS_PER_TRAVELER=${{ vars.YADONY_REQUESTS_MAX_OPEN_THREADS_PER_TRAVELER }}
          YADONY_REQUESTS_THREADS_PER_MINUTE_RATE_LIMIT=${{ vars.YADONY_REQUESTS_THREADS_PER_MINUTE_RATE_LIMIT }}
          YADONY_REQUESTS_ESTIMATION_CORRIDOR_RECENT_TRIPS=${{ vars.YADONY_REQUESTS_ESTIMATION_CORRIDOR_RECENT_TRIPS }}
          YADONY_REQUESTS_ESTIMATION_CACHE_TTL_MINUTES=${{ vars.YADONY_REQUESTS_ESTIMATION_CACHE_TTL_MINUTES }}
          YADONY_MOBILEMONEY_LINK_EXPIRY_MINUTES=${{ vars.YADONY_MOBILEMONEY_LINK_EXPIRY_MINUTES }}
          YADONY_EMAIL_FROM_ADDRESS=${{ vars.YADONY_EMAIL_FROM_ADDRESS }}
          APP_PLACES_RATE_LIMIT_PER_MINUTE=${{ vars.APP_PLACES_RATE_LIMIT_PER_MINUTE }}
          APP_PLACES_DAILY_QUOTA_AUTOCOMPLETE=${{ vars.APP_PLACES_DAILY_QUOTA_AUTOCOMPLETE }}
          APP_PLACES_DAILY_QUOTA_DETAILS=${{ vars.APP_PLACES_DAILY_QUOTA_DETAILS }}
          APP_PLACES_DAILY_QUOTA_REVERSE=${{ vars.APP_PLACES_DAILY_QUOTA_REVERSE }}
          APP_PLACES_BLOCK_WHEN_QUOTA_EXCEEDED=${{ vars.APP_PLACES_BLOCK_WHEN_QUOTA_EXCEEDED }}
          EOF
          chmod 600 .env.staging
          echo "✅ Fichier .env.staging créé (600 permissions)"

      - name: Préparer répertoires sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/yadony
            cd ~/yadony
            echo "📁 Création des répertoires..."
            mkdir -p nginx/certs nginx/static nginx/www backups
            echo "🧹 Réinitialisation du dossier monitoring (config régénérée depuis le repo)..."
            # D'anciens fichiers (ex: config Loki) ont pu être créés par des conteneurs
            # tournant en root → "Permission denied" pour l'utilisateur debian.
            # On supprime via un conteneur jetable root pour fiabiliser le nettoyage.
            if [ -d monitoring ]; then
              docker run --rm -v "$PWD:/work" alpine rm -rf /work/monitoring || rm -rf monitoring
            fi
            echo "🧹 Reprise en main de nginx/static..."
            # Même piège que monitoring, mais en pire : nginx/static est monté
            # (docker-compose.staging.yml) et Docker crée les chemins manquants en
            # root. Le logo.png ainsi créé n'était plus écrasable par l'utilisateur
            # SSH, et le `scp` échouait — bloquant TOUT déploiement, y compris ceux
            # qui n'avaient rien à voir avec le logo.
            # On rend le dossier à l'utilisateur courant plutôt que de le supprimer :
            # il est remplacé juste après par le contenu du repo.
            docker run --rm -v "$PWD:/work" alpine \
              chown -R "$(id -u):$(id -g)" /work/nginx/static || true
            echo "✅ Répertoires prêts"

      - name: Transférer compose, config et .env au VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.OVH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_ed25519"
          DEST="${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/yadony"

          echo "📤 docker-compose.staging.yml (source unique)..."
          scp $SSH_OPTS docker-compose.staging.yml "$DEST/"

          echo "📤 .env.staging..."
          scp $SSH_OPTS .env.staging "$DEST/"

          echo "📤 nginx.staging.conf..."
          scp $SSH_OPTS nginx/nginx.staging.conf "$DEST/nginx/"

          echo "📤 nginx/static/..."
          scp $SSH_OPTS -O -r nginx/static "$DEST/nginx/"

          echo "📤 monitoring/ (alloy, prometheus, grafana)..."
          # -O force le protocole SCP historique : le mode SFTP par défaut
          # (OpenSSH 9.x) ne crée pas les sous-dossiers imbriqués manquants.
          scp $SSH_OPTS -O -r monitoring "$DEST/"

          echo "✅ Tous les fichiers transférés"

      - name: Déploiement Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            cd ~/yadony

            echo "🔐 Connexion à GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            echo "📥 Pull de l'image API..."
            docker compose --env-file .env.staging -f docker-compose.staging.yml pull api

            echo "🚀 Démarrage de TOUS les services (api, db, nginx, monitoring, stripe-cli)..."
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --remove-orphans

            echo "🔄 Reload nginx (le bind mount de nginx.staging.conf ne déclenche pas de recreate via 'compose up')..."
            docker exec yadony_nginx nginx -t && docker exec yadony_nginx nginx -s reload

            echo "🧹 Nettoyage des images inutiles..."
            docker image prune -f

            echo "✅ Déploiement effectué"

      - name: Health check — Base de données (30s)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            cd ~/yadony

            echo "🔍 Vérification de PostgreSQL..."
            for i in $(seq 1 6); do
              if docker exec yadony_db_staging pg_isready -U "${{ secrets.DB_USERNAME }}" -d yadony_staging 2>/dev/null | grep -q "accepting"; then
                echo "✅ PostgreSQL healthy (tentative $i)"
                exit 0
              fi
              echo "  ⏳ Tentative $i/6 — attente 5s..."
              sleep 5
            done
            echo "❌ PostgreSQL non disponible après 30s"
            exit 1

      - name: Health check — API (60s)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -e
            cd ~/yadony

            echo "🔍 Vérification de l'API..."
            for i in $(seq 1 12); do
              # Attendre que le conteneur soit prêt
              if ! docker ps | grep -q yadony_api; then
                echo "  ⏳ Tentative $i/12 — conteneur en démarrage..."
                sleep 5
                continue
              fi

              # Vérifier l'endpoint health
              STATUS=$(docker exec yadony_api wget -q -O - http://localhost:8080/api/v1/actuator/health 2>/dev/null | grep -o '"status":"[^"]*"' | grep -o '[^"]*"$' | tr -d '"' || echo "UNKNOWN")

              if [ "$STATUS" = "UP" ]; then
                echo "✅ API healthy (tentative $i/12)"
                exit 0
              fi
              echo "  ⏳ Tentative $i/12 — état: $STATUS"
              sleep 5
            done

            echo "❌ API non disponible après 60s"
            echo "📋 Derniers logs:"
            docker logs yadony_api | tail -20
            exit 1

      - name: Rapport de déploiement
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set +e
            cd ~/yadony

            echo ""
            echo "═════════════════════════════════════════"
            echo "📊 RAPPORT DE DÉPLOIEMENT"
            echo "═════════════════════════════════════════"
            echo ""
            echo "🐳 Conteneurs:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "yadony_|NAMES"
            echo ""
            echo "📦 Images:"
            docker images | grep yadony | head -3
            echo ""
            echo "💾 Volumes:"
            docker volume ls | grep yadony
            echo ""
            echo "📝 Logs API (dernières 10 lignes):"
            docker logs yadony_api --tail 10
            echo ""
            echo "═════════════════════════════════════════"
