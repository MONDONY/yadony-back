name: CI

on:
  # Une branche de travail est testée par sa PR, et par elle seule. L'ancien
  # `push: branches-ignore: [main]` relançait la même suite en parallèle à chaque
  # commit poussé, et la fusion attendait les deux (32 min pour la PR, 42 pour le
  # push, mesuré le 2026-09-30). Seules les branches `staging/**` gardent le push :
  # c'est ce run qui émet le `workflow_run` dont dépend Deploy Staging.
  push:
    branches: ['staging/**']
  # Sans filtre de base : une PR empilée sur une autre branche que main était
  # couverte par le push, elle doit garder sa CI.
  pull_request:

# Un nouveau commit sur une PR annule la CI du commit précédent, devenue caduque.
# Chaque push sur staging/** a son propre groupe (run_id) et n'est jamais annulé :
# Deploy Staging lit la conclusion de ce run, un run annulé ferait échouer le
# déploiement au lieu de simplement laisser passer le suivant.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  test:
    name: Tests & Couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Une seule passe : `verify` enchaîne déjà les tests, le rapport JaCoCo (lié
      # à la phase test), le package et jacoco:check (seuil dans pom.xml). L'ancien
      # `mvnw test` suivi de `mvnw verify` exécutait toute la suite deux fois,
      # 16 min chacune (mesuré le 2026-09-30).
      - name: Tests + gate couverture (bloquant — seuil configuré dans pom.xml)
        run: |
          chmod +x mvnw
          ./mvnw verify -Dspring.profiles.active=test --no-transfer-progress
      - name: Upload rapport couverture
        uses: actions/upload-artifact@v4
        if: always()
        # L'archivage du rapport est un confort, jamais un critere : le verdict des
        # tests et du seuil de couverture est deja rendu par l'etape precedente. Sans
        # ce drapeau, un quota de stockage d'artefacts sature — quota du COMPTE, et
        # recalcule seulement toutes les 6 a 12 h — fait echouer une CI dont tous les
        # tests sont verts, et bloque au passage le deploiement staging qui exige une
        # CI reussie. Constate le 2026-09-05.
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  static-analysis:
    name: SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Compilation complète (sources + tests)
        run: |
          chmod +x mvnw
          ./mvnw test-compile --no-transfer-progress
      - name: SpotBugs — bugs HIGH = échec
        run: ./mvnw spotbugs:check --no-transfer-progress
      - name: Upload rapport SpotBugs
        uses: actions/upload-artifact@v4
        if: always()
        # Meme raison que pour le rapport de couverture : l'etape « bugs HIGH = echec »
        # ci-dessus porte deja le verdict, l'archive n'est qu'une commodite de lecture.
        continue-on-error: true
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

  security-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — CVE CRITICAL = échec
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          skip-dirs: target,docs,.github,.mvn

  docker-lint:
    name: Hadolint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
