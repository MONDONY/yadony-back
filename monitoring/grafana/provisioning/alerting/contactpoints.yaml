apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram-yadony
        type: telegram
        settings:
          bottoken: "$__env{TELEGRAM_BOT_TOKEN}"
          # Pas une valeur secrete (identifiant de destination, pas une
          # credential) : en dur, car $__env{} casse le typage JSON quand la
          # valeur ressemble a un nombre (chat id negatif de channel/groupe) —
          # bug connu du provisioning Grafana, meme avec des guillemets YAML.
          chatid: "-1003922308666"
          message: |-
            🔔 {{ .CommonLabels.alertname }}
            Statut : {{ .Status }}
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}
          parse_mode: none
        disableResolveMessage: false
