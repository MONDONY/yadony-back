# Contextes Spring gardés en cache par JVM de test (32 par défaut). Chaque contexte
# garde ses ~116 dépôts JPA, son métamodèle Hibernate, ses tâches planifiées et,
# pour les *PostgresIT, un Postgres embarqué. À 32, le tas par défaut d'un fork
# (1/4 de la RAM du runner : 1,75 Go sur les 7 Go de la CI) sature : le
# 2026-11-04, la CI de la PR #696 a
# tourné 6 h (deux fois) après un OutOfMemoryError au chargement d'un contexte,
# suivi d'une cascade d'erreurs puis d'un blocage. Au-delà de 16, le contexte le
# moins récemment utilisé est fermé, ce qui libère aussi son Postgres embarqué.
spring.test.context.cache.maxSize=16
