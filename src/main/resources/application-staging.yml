# Staging profile — copie durcie de prod avec logs verbeux pour diagnostic
# Swagger désactivé comme en prod : la carte complète des endpoints ne doit pas
# être servie anonymement sur un domaine public. Pour diagnostiquer, lancer le
# profil dev en local ou port-forward.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: framework

logging:
  level:
    com.yadony.api: DEBUG
    org.springframework.security: INFO

sentry:
  dsn: ${SENTRY_DSN:}
  environment: staging
  enabled: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://yadony_db_staging:5432/yadony_staging}
    username: ${DB_USERNAME:yadony}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

# Stripe Connect : Stripe exige des URLs HTTPS pour return/refresh.
# Le défaut de application.yml (yadony://) est un deep link invalide côté Stripe.
# Ces endpoints backend (StripeOnboardingRedirectController) redirigent en 302
# vers le deep link yadony:// pour revenir dans l'app.
yadony:
  stripe:
    connect:
      return-url: "https://api-staging.yadony.com/api/v1/payments/onboarding/return"
      refresh-url: "https://api-staging.yadony.com/api/v1/payments/onboarding/refresh"

  # Abonnement PRO : sans ces trois surcharges, staging héritait des défauts de
  # application.yml, qui pointent sur https://yadony.com/pro — la PRODUCTION.
  # Un paiement de test aurait donc renvoyé le navigateur sur le portail réel,
  # avec un `?success=1` qu'aucun abonnement de production ne justifie : l'écran
  # d'attente d'activation y aurait tourné dans le vide.
  billing:
    success-url: "https://staging.yadony.com/pro/parametres/abonnement?success=1"
    cancel-url: "https://staging.yadony.com/pro/upgrade?canceled=1"
    portal-return-url: "https://staging.yadony.com/pro/parametres/abonnement"
  wallet:
    topup:
      checkout-success-url: "https://staging.yadony.com/pro/parametres?topup=success"
      checkout-cancel-url: "https://staging.yadony.com/pro/parametres?topup=canceled"
