# Production profile — security hardening
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: framework

sentry:
  dsn: ${SENTRY_DSN:}
  environment: prod
  enabled: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/yadony_prod}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook:
    payments-secret: ${STRIPE_WEBHOOK_PAYMENTS_SECRET}
    kyc-secret: ${STRIPE_WEBHOOK_KYC_SECRET}

yadony:
  kyc:
    enforce: true
  stripe:
    enforce: true
    webhook:
      scheduler-enabled: true
      poll-interval: 10s
      batch-size: 50
      max-retries: 8
      retry-backoff-base: 30s
