# Production profile — security hardening
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: framework

sentry:
  dsn: ${SENTRY_DSN:}
  environment: prod
  enabled: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/yadony_prod}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Aligné sur la staging (#434), validé au test de charge k6 du 08/10 : avec 10
      # connexions et le timeout par défaut de 30 s, le pool saturait (187 requêtes en
      # attente) et les requêtes échouaient en 500 après 30 s. 20 connexions restent loin
      # du max_connections=100 de Postgres ; un timeout de 5 s échoue vite en 503
      # service-busy (GlobalExceptionHandler) au lieu de bloquer un thread 30 s.
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook:
    payments-secret: ${STRIPE_WEBHOOK_PAYMENTS_SECRET}
    kyc-secret: ${STRIPE_WEBHOOK_KYC_SECRET}
    billing-secret: ${STRIPE_WEBHOOK_BILLING_SECRET}

yadony:
  kyc:
    enforce: true
  stripe:
    enforce: true
    webhook:
      scheduler-enabled: true
      poll-interval: 10s
      batch-size: 50
      max-retries: 8
      retry-backoff-base: 30s
  billing:
    trial-days: ${YADONY_BILLING_TRIAL_DAYS:7}
    price-monthly: ${STRIPE_BILLING_PRICE_MONTHLY}
    price-yearly: ${STRIPE_BILLING_PRICE_YEARLY}
    success-url: ${YADONY_BILLING_SUCCESS_URL:https://yadony.com/pro/parametres/abonnement?success=1}
    cancel-url: ${YADONY_BILLING_CANCEL_URL:https://yadony.com/pro/upgrade?canceled=1}
    portal-return-url: ${YADONY_BILLING_PORTAL_RETURN_URL:https://yadony.com/pro/parametres/abonnement}
