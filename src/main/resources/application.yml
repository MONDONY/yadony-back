spring:
  task:
    scheduling:
      # Un seul thread par défaut : n'importe quel cron pendu (fetch réseau sans
      # timeout, 2026-09-02) gèlerait TOUS les autres jobs planifiés du back.
      pool:
        size: 4
  application:
    name: yadony-back
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Pool JDBC — commun à tous les profils (ne pas surcharger dans application-*.yml).
  # YADONY-BACK-STAGING-11 : une connexion morte en silence (coupure réseau ou
  # Postgres redémarré) n'était détectée qu'au maxLifetime par défaut (30 min), à
  # l'emprunt, et la requête échouait. Le keepalive sonde chaque connexion inactive
  # toutes les 60 s et la remplace si elle ne répond plus ; un maxLifetime de 15 min
  # recycle aussi les connexions actives bien avant tout délai côté Postgres
  # (défauts : idle_session_timeout désactivé, tcp_keepalives_idle système 2 h) ou réseau
  # (conntrack Linux par défaut : 5 jours). Hikari exige keepalive-time < max-lifetime.
  datasource:
    hikari:
      keepalive-time: 60000
      max-lifetime: 900000

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        # Charge les collections et proxys paresseux par lots (IN (...)) au lieu d'un
        # SELECT par entité : user_roles et user_languages (EAGER) étaient lus deux
        # fois par utilisateur de chaque liste.
        default_batch_fetch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson — camelCase + ISO 8601 UTC
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # Security
  security:
    user:
      name: disabled
      password: disabled

  # Multipart upload (Spring's defaults are 1 MB / 10 MB which truncate
  # photos coming from mobile cameras — bumped to match StorageService.MAX_FILE_SIZE)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Server
server:
  servlet:
    context-path: /api/v1
  port: 8080
  error:
    whitelabel:
      enabled: false
  # Tomcat enforces its own multipart limits before Spring sees the request.
  # Default 2 MB rejects mobile photos silently — bumped to match StorageService.
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      # Spring Boot 3.5+: use `access` only — `enabled` is mutually exclusive.
      # Prometheus is scraped by the internal monitoring stack.
      # NOT in SecurityConfig permitAll — scraper must authenticate or be
      # isolated at the network level (Nginx/firewall).
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # Quelques bornes fixes plutot que l'histogramme complet (~70 buckets par serie) :
      # assez pour les p50/p95/p99 des dashboards Grafana (histogram_quantile), vides
      # jusqu'ici faute de series _bucket, sans multiplier les series Prometheus.
      slo:
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
        "[hikaricp.connections.acquire]": 1ms,5ms,25ms,100ms,500ms,1s,5s
  server:
    port: 8080

# OpenAPI / Swagger — disabled by default, enabled only in dev profile
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  packages-to-scan: com.yadony.api

# Logging
logging:
  # Identifiant de corrélation posé dans le MDC par RequestCorrelationFilter
  # (en-tête X-Request-Id, repris ou généré). `pattern.correlation` est l'emplacement
  # que le pattern Logback par défaut de Spring Boot réserve à cet usage
  # (${LOG_CORRELATION_PATTERN}, juste après le nom du thread, console et fichier) :
  # on ne réécrit pas tout le pattern. Hors requête HTTP (jobs planifiés, démarrage)
  # les crochets sont imprimés vides. Sentry n'est pas concerné : son appender
  # Logback lit le MDC directement.
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    com.yadony.api: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    # Hibernate logge en ERROR chaque SQLException AVANT de la lever, y compris celles
    # que le code attrape volontairement (course getOrCreate du wallet, contrainte
    # UNIQUE attendue). Chacune devenait une issue Sentry sans qu'aucune requête n'ait
    # échoué (YADONY-BACK-STAGING-7). Les erreurs qui se propagent vraiment sont déjà
    # loggées, avec la cause SQL complète, par GlobalExceptionHandler.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

# Sentry : commun à tous les profils. `dsn`, `environment` et `enabled` restent
# dans application-{staging,prod}.yml (désactivé en dev et en test).
sentry:
  # Produit « Logs » de Sentry (onglet Logs, requêtable), distinct des événements
  # d'erreur. Exige sentry-java >= 8.11. Sans ce bloc, l'appender Logback du
  # starter n'envoyait que les ERROR (événements) et gardait INFO+ en breadcrumbs.
  logs:
    enabled: true
  logging:
    # Seuls WARN et ERROR partent en Sentry Logs : le DEBUG du profil staging
    # (com.yadony.api: DEBUG) mangerait le quota sans valeur de diagnostic.
    minimum-level: warn
    # Un ERROR reste un événement (issue) ; WARN n'en crée pas.
    minimum-event-level: error
    # Les INFO restent joints aux événements comme fil d'Ariane, sans être envoyés
    # tels quels.
    minimum-breadcrumb-level: info

# Yadony business config
# Toutes les valeurs métier sont surchargeables par variable d'environnement
# (${VAR:défaut}) — provisioning prod sans rebuild.
yadony:
  # Coûts des prestataires, pour le simulateur de marge de l'onglet Tarification UNIQUEMENT (jamais
  # le prix). Tarif public Stripe France vérifié le 18/10/2026 ; les frais pawaPay sont sous
  # yadony.pawapay.fees. Montants fixes en euros, convertis dans la devise du simulateur.
  costs:
    stripe:
      card-standard-percent: 1.5
      card-premium-percent: 2.8
      card-international-percent: 3.15
      card-fixed-eur: 0.25
      connect-payout-percent: 0.25
      connect-payout-fixed-eur: 0.10
      connect-active-account-monthly-eur: 2.0
  # Contact du support affiché sur la page publique du QR colis (/tracking/{id}/scan).
  # Numéro WhatsApp en format libre (les non-chiffres sont retirés). Vide = bouton masqué.
  support:
    whatsapp-number: ${SUPPORT_WHATSAPP_NUMBER:}
    email: ${SUPPORT_EMAIL:support@yadony.com}
  # Billets d'avion en affiliation (Travelpayouts / Aviasales, package flights). Sans token,
  # les endpoints /flights répondent 503 flights-unavailable et le scheduler ne fait rien.
  flights:
    travelpayouts:
      token: ${TRAVELPAYOUTS_TOKEN:}
      marker: ${TRAVELPAYOUTS_MARKER:}
      api-base-url: https://api.travelpayouts.com
      autocomplete-url: https://autocomplete.travelpayouts.com
      booking-base-url: https://www.aviasales.com
      # <marker>.<subId> dans le lien : à activer une fois le format validé sur le compte partenaire.
      subid-enabled: ${TRAVELPAYOUTS_SUBID_ENABLED:false}
    # Logo des compagnies : {code} = code IATA. Service d'images Travelpayouts (voir leur article
    # « Airline logos by Aviasales »), https à valider sur le compte avant la mise en prod.
    logo-url-template: ${FLIGHTS_LOGO_URL_TEMPLATE:https://img.wway.io/pics/root/{code}@png?exar=1&rs=fit:200:200}
    # Trajets des bons plans quand l'utilisateur n'a encore aucun corridor.
    default-routes: PAR-ABJ,PAR-DKR,PAR-BKO,PAR-DLA,PAR-CMN,PAR-COO,PAR-CKY,PAR-OUA
    alerts:
      enabled: ${FLIGHT_ALERTS_ENABLED:true}
      cron: "0 7 */6 * * *"
    # Ligne de diagnostic [FlightSearchDiag] (WARN) des recherches aller-retour à jours précis qui
    # rendent moins de 5 offres. Fermée par défaut, ouverte en dev et staging (application-<profil>.yml).
    search:
      diagnostic:
        enabled: ${FLIGHTS_SEARCH_DIAGNOSTIC_ENABLED:false}
  # Mode recette des comptes testeurs (FLUTTER-FA/FB) : fermé partout sauf en staging
  # (application-staging.yml). Toujours fermé sous le profil prod, quelle que soit la valeur.
  recette:
    enabled: false
  # Sonde de cohérence de l'argent (MoneyIntegrityMonitor) : 17 règles SQL en lecture seule,
  # jauge yadony_money_invariant_violations, alerte MONEY_INVARIANT_<règle> si le compte monte.
  money-integrity:
    enabled: ${MONEY_INTEGRITY_ENABLED:true}
    cron: "0 */15 * * * *"
  # Rapprochement quotidien avec Stripe et pawaPay (ProviderReconciliationJob) : alerte
  # RECON_<PRESTATAIRE>_<référence> par écart, jauges yadony_reconciliation_*.
  reconciliation:
    enabled: ${PROVIDER_RECONCILIATION_ENABLED:true}
    cron: "0 30 4 * * *"
  # Auto-réparation des paiements carte restés PENDING (PendingCardPaymentAutoHealJob) : relit le
  # PaymentIntent chez Stripe et applique la resynchronisation (séquestre, versement si déjà livré).
  payments:
    # Moyens de la feuille de paiement : ces trois valeurs n'AMORCENT que les réglages plateforme
    # payments_paypal_enabled / payments_apple_pay_enabled / payments_google_pay_enabled au premier
    # démarrage ; ensuite on les bascule depuis le back-office (Paramètres), sans redéploiement.
    # PayPal : à n'activer qu'une fois la capacité paypal_payments active sur le compte Stripe
    # plateforme, sinon Stripe refuse le PaymentIntent (YADONY-FLUTTER-PROD-10/11). Apple Pay :
    # certificat de traitement merchant.app.yadony chez Stripe. Google Pay : activé chez Stripe.
    paypal-enabled: ${PAYMENTS_PAYPAL_ENABLED:false}
    apple-pay-enabled: ${PAYMENTS_APPLE_PAY_ENABLED:false}
    google-pay-enabled: ${PAYMENTS_GOOGLE_PAY_ENABLED:false}
    # Reprise des versements carte réservés non confirmés par Stripe (PROD_CHECKLIST 9.23).
    release-recovery:
      enabled: ${PAYMENT_RELEASE_RECOVERY_ENABLED:true}
      interval: PT5M
      batch-size: 20
    # Suivi du virement bancaire du voyageur (BankPayoutSyncJob) : complète la date de
    # disponibilité des Transfers récents et relit les payouts des comptes connectés concernés.
    # Filet du webhook payout.* des comptes connectés, donc fréquence faible.
    bank-payout-sync:
      enabled: ${BANK_PAYOUT_SYNC_ENABLED:true}
      interval: PT6H
      initial-delay: PT3M
      lookback-days: 60
      batch-size: 100
    auto-heal:
      enabled: ${PAYMENT_AUTO_HEAL_ENABLED:true}
      interval: PT15M
      min-age: PT10M
      max-age: P7D
      abandoned-after: PT24H
      batch-size: 20
  # Numéro de suivi saisi par le voyageur à la remise du colis (DEPART, FLUTTER-BC). Vérifié dès
  # qu'il est envoyé ; exigé seulement si ce réglage est vrai (allumer une fois l'app à jour).
  tracking:
    require-number-on-depart: ${TRACKING_REQUIRE_NUMBER_ON_DEPART:false}
  # Relance J+1/J+3 des comptes au KYC vérifié sans première action (activation/).
  # Coupée par défaut ; activée en staging (application-staging.yml), prod à la décision du propriétaire.
  activation:
    first-action-reminders:
      enabled: ${YADONY_ACTIVATION_FIRST_ACTION_REMINDERS_ENABLED:false}
  # Secret partagé avec les Cloud Functions (dony-functions) pour
  # POST /internal/messaging/notify. Déclaré ici et non dans application-dev.yml
  # seul : sans cette clé, `yadony.internal.secret` reste vide en staging et en
  # prod, et MessagingNotifyController rejette *tout* appel en 401 — aucune push
  # de nouveau message n'est jamais partie.
  internal:
    secret: ${INTERNAL_SHARED_SECRET:}
  admin:
    bootstrap:
      secret: ${ADMIN_BOOTSTRAP_SECRET:}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    sentry-webhook:
      secret: ${SENTRY_WEBHOOK_SECRET:}
      # Slugs des projets Sentry relayés, séparés par des virgules (vide = tous).
      projects: ${SENTRY_WEBHOOK_PROJECTS:}
  notifications:
    # Heures calmes (22 h - 8 h, heure locale) et plafond de 10 push non critiques par jour.
    # Les retenus de la nuit partent en un récapitulatif dès 8 h (NightDigestScheduler).
    quiet-hours:
      enabled: ${YADONY_NOTIFICATIONS_QUIET_HOURS_ENABLED:true}
    # E-mails des notifications (NotificationEmailPolicy) : reçus, décisions, récapitulatifs,
    # alertes. Sans clé Resend, ResendEmailService n'envoie rien de toute façon.
    email:
      enabled: ${YADONY_NOTIFICATIONS_EMAIL_ENABLED:true}
    caps:
      # Que faire d'un libellé qui dépasse NotificationCaps (titre 28, corps 72) :
      # off | warn | strict. « warn » tant que les points d'émission ne sont pas
      # tous réécrits ; « strict » ensuite, dans les tests d'abord.
      mode: ${YADONY_NOTIFICATIONS_CAPS_MODE:warn}
  commission:
    rate: ${YADONY_COMMISSION_RATE:0.05}
    minimum-amount: ${YADONY_COMMISSION_MINIMUM_AMOUNT:1.00}
    no-show-contestation-hours: ${YADONY_COMMISSION_NO_SHOW_CONTESTATION_HOURS:24}
  # Supplément de prix demandé par le voyageur à la remise (V338). Éteint tant que les
  # apps qui l'affichent ne sont pas sorties ; bornes décidées par le propriétaire (19/10).
  bid-supplement:
    enabled: ${BID_SUPPLEMENT_ENABLED:false}
    expiry: ${BID_SUPPLEMENT_EXPIRY:PT2H}
    departure-margin: ${BID_SUPPLEMENT_DEPARTURE_MARGIN:PT15M}
    max-per-bid: ${BID_SUPPLEMENT_MAX_PER_BID:2}
    min-net-eur: ${BID_SUPPLEMENT_MIN_NET_EUR:1}
    max-net-eur: ${BID_SUPPLEMENT_MAX_NET_EUR:300}
    reconcile-interval: ${BID_SUPPLEMENT_RECONCILE_INTERVAL:PT10M}
    # Mobile money : opérations pawaPay mortes (versement, remboursement) avant intervention manuelle.
    mm-max-attempts: ${BID_SUPPLEMENT_MM_MAX_ATTEMPTS:3}
  # Modification d'un colis accepté (V347) : l'expéditeur ajoute des kilos ou des articles de grille,
  # payés comme une 2e transaction. Éteint tant que les apps qui l'affichent ne sont pas sorties.
  bid-amendment:
    enabled: ${BID_AMENDMENT_ENABLED:false}
    expiry: ${BID_AMENDMENT_EXPIRY:PT48H}
    departure-margin: ${BID_AMENDMENT_DEPARTURE_MARGIN:PT15M}
    min-response-window: ${BID_AMENDMENT_MIN_RESPONSE_WINDOW:PT2H}
    authorization-window: ${BID_AMENDMENT_AUTHORIZATION_WINDOW:PT30M}
    commission-confirm-window: ${BID_AMENDMENT_COMMISSION_CONFIRM_WINDOW:PT30M}
    reminder-before: ${BID_AMENDMENT_REMINDER_BEFORE:PT6H}
    max-accepted-per-bid: ${BID_AMENDMENT_MAX_ACCEPTED_PER_BID:2}
    min-net-eur: ${BID_AMENDMENT_MIN_NET_EUR:1}
    max-net-eur: ${BID_AMENDMENT_MAX_NET_EUR:300}
    reconcile-interval: ${BID_AMENDMENT_RECONCILE_INTERVAL:PT10M}
    reconcile-enabled: ${BID_AMENDMENT_RECONCILE_ENABLED:true}
    # Mobile money : opérations pawaPay mortes (versement, remboursement) avant intervention manuelle.
    mm-max-attempts: ${BID_AMENDMENT_MM_MAX_ATTEMPTS:3}
  # Procédure « destinataire absent » (FLUTTER-E2, V301).
  delivery-no-show:
    min-wait-minutes: ${YADONY_DELIVERY_NO_SHOW_MIN_WAIT_MINUTES:120}
    hold-days: ${YADONY_DELIVERY_NO_SHOW_HOLD_DAYS:7}
  # Classement des annonces de trajet (poids du score de confiance, voir spec classement-annonces).
  ranking:
    weights:
      reliability: ${YADONY_RANKING_WEIGHT_RELIABILITY:30}
      rating: ${YADONY_RANKING_WEIGHT_RATING:25}
      deliveries: ${YADONY_RANKING_WEIGHT_DELIVERIES:20}
      freshness: ${YADONY_RANKING_WEIGHT_FRESHNESS:15}
      online-payment: ${YADONY_RANKING_WEIGHT_ONLINE_PAYMENT:10}
    exact-threshold: ${YADONY_RANKING_EXACT_THRESHOLD:7}
    similar-max: ${YADONY_RANKING_SIMILAR_MAX:20}
    max-candidates: ${YADONY_RANKING_MAX_CANDIDATES:1000}
    max-candidates-without-city: ${YADONY_RANKING_MAX_CANDIDATES_WITHOUT_CITY:300}
  urgency:
    threshold-days: ${YADONY_URGENCY_THRESHOLD_DAYS:3}
  exchange-rates:
    # Synchronisation quotidienne des taux flottants (USD/CAD/GBP/CHF) depuis les
    # taux de référence BCE — EUR (pivot) et XOF/XAF (parité fixe par traité) ne
    # sont jamais touchés. Une variation relative au-delà du garde-fou n'est PAS
    # appliquée : alerte admin (Sentry + Telegram), l'humain tranche au back-office.
    sync-enabled: ${YADONY_EXCHANGE_RATES_SYNC_ENABLED:true}
    sync-cron: ${YADONY_EXCHANGE_RATES_SYNC_CRON:0 0 7 * * *}
    max-relative-change: ${YADONY_EXCHANGE_RATES_MAX_RELATIVE_CHANGE:0.10}
    ecb-url: ${YADONY_EXCHANGE_RATES_ECB_URL:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
  cash-commission:
    orphan-pi-cleanup-cron: "0 */15 * * * *"
    orphan-pi-timeout-minutes: 30
    no-show-timeout-cron: "0 0 * * * *"
    card-expiration-warning-days: 30
  cancellation:
    return-deadline-cron: "0 0 * * * *"
  guest:
    # Combien de temps on garde la ligne « users » d'un visiteur anonyme qui n'est
    # jamais devenu un compte. Au-delà, GuestUserCleanupScheduler la supprime — mais
    # seulement si elle ne porte ni rôle, ni favori, ni la moindre marque de compte
    # réel. Une valeur inférieure à 1 désactive la purge (voir MIN_RETENTION_DAYS).
    retention-days: ${YADONY_GUEST_RETENTION_DAYS:30}
  limits:
    non-pro:
      monthly-announcements: ${YADONY_LIMITS_NON_PRO_MONTHLY_ANNOUNCEMENTS:2}
  pro:
    # Feature flag de l'offre PRO. Faux par defaut : l'application mobile masque toute
    # entree PRO et les quotas des comptes standard ne s'appliquent pas, le temps de
    # terminer l'offre. Valeur d'AMORCAGE seulement : une fois la ligne pro_enabled
    # presente dans platform_settings, c'est le back-office (Parametres) qui decide.
    enabled: ${YADONY_PRO_ENABLED:false}
  escrow-timeout-hours: ${YADONY_ESCROW_TIMEOUT_HOURS:48}
  gp-pro:
    # Revue quotidienne des titulaires du badge GP Pro et purge de secours des justificatifs.
    scheduler-enabled: ${YADONY_GP_PRO_SCHEDULER_ENABLED:true}
    review-cron: ${YADONY_GP_PRO_REVIEW_CRON:0 15 4 * * *}
    cleanup-cron: ${YADONY_GP_PRO_CLEANUP_CRON:0 45 4 * * *}
  billing:
    # Faux tant que le lot 2 (Stripe Checkout) n'est pas en production :
    # sans lui, les comptes en grâce n'ont aucun moyen de s'abonner.
    scheduler-enabled: ${YADONY_BILLING_SCHEDULER_ENABLED:false}
    legacy-grace-days: ${YADONY_BILLING_LEGACY_GRACE_DAYS:60}
    dunning-grace-days: ${YADONY_BILLING_DUNNING_GRACE_DAYS:5}
    expiry-cron: ${YADONY_BILLING_EXPIRY_CRON:0 30 3 * * *}
    # Essai gratuit, en jours. Zéro ou négatif signifie « pas d'essai » : le champ est
    # alors omis de la session Checkout, Stripe refusant une durée nulle.
    # Trois conditions cumulatives pour en bénéficier, cf. ProTrialPolicy : un essai
    # configuré, au moins un trajet réalisé, et n'avoir jamais été client Stripe.
    trial-days: ${YADONY_BILLING_TRIAL_DAYS:7}
    price-monthly: ${STRIPE_BILLING_PRICE_MONTHLY:}
    price-yearly: ${STRIPE_BILLING_PRICE_YEARLY:}
    success-url: ${YADONY_BILLING_SUCCESS_URL:https://yadony.com/pro/parametres/abonnement?success=1}
    cancel-url: ${YADONY_BILLING_CANCEL_URL:https://yadony.com/pro/upgrade?canceled=1}
    portal-return-url: ${YADONY_BILLING_PORTAL_RETURN_URL:https://yadony.com/pro/parametres/abonnement}
  wallet:
    topup:
      # Retour du portail PRO après une recharge par carte (Stripe Checkout).
      checkout-success-url: ${YADONY_WALLET_TOPUP_SUCCESS_URL:https://yadony.com/pro/parametres?topup=success}
      checkout-cancel-url: ${YADONY_WALLET_TOPUP_CANCEL_URL:https://yadony.com/pro/parametres?topup=canceled}
    refund-fee:
      # Repli quand le frais Stripe réel (balance_transaction.fee) est illisible.
      stripe-fallback:
        percent: ${WALLET_REFUND_FEE_STRIPE_FALLBACK_PERCENT:3.15}
        fixed: ${WALLET_REFUND_FEE_STRIPE_FALLBACK_FIXED:0.25}
  dispute-sla-hours: ${YADONY_DISPUTE_SLA_HOURS:72}
  reimbursement:
    max-amount-eur: ${YADONY_REIMBURSEMENT_MAX_AMOUNT_EUR:50}
  kyc:
    return-url: ${YADONY_KYC_RETURN_URL:https://yadony.com/kyc/complete}
    verification-flow-id: ${YADONY_KYC_VERIFICATION_FLOW_ID:}
    didit:
      # Valeur d'AMORCAGE seulement : une fois la ligne kyc_didit_enabled presente dans
      # platform_settings, c'est elle qui fait autorite et se bascule depuis le back-office.
      # Faux = Stripe Identity, vrai = Didit. Ne concerne que les NOUVELLES sessions : une
      # session existante se relit toujours chez le fournisseur qui l'a produite.
      enabled: ${KYC_DIDIT_ENABLED:false}
    # Lien « voir la session » de la fiche KYC admin, par fournisseur. Modele d'URL dont
    # {sessionId} est remplace par l'identifiant de session. Vide = pas de lien (null).
    # Stripe : https://dashboard.stripe.com/identity/verification-sessions/{sessionId}
    # (prefixer par /test/ en staging). Didit : aucun format de console connu du code.
    console-url:
      stripe: ${KYC_CONSOLE_URL_STRIPE:}
      didit: ${KYC_CONSOLE_URL_DIDIT:}
  # Appels audio in-app (Stream Video). Coupés par défaut : CALLS_ENABLED=true + clés pour activer.
  calls:
    enabled: ${CALLS_ENABLED:false}
    base-url: ${STREAM_BASE_URL:https://video.stream-io-api.com}
    api-key: ${STREAM_API_KEY:}
    api-secret: ${STREAM_API_SECRET:}
    call-type: audio_call
    delivery-grace-days: 3
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    daily-quota: ${ASSISTANT_DAILY_QUOTA:20}
    # Score BM25 brut de Lucene (pas normalisé). Mesuré sur les vraies fiches : questions complètes 16 à 30,
    # mots seuls 8,7 à 13, hors-sujet 0 à 6,1 pour la plupart (KnowledgeBaseFichesTest).
    min-score: 6.5
    # Formulaires remplis par l'IA (spec 2026-10-17-formulaires-ia) : exige aussi enabled ci-dessus.
    form-draft:
      enabled: ${ASSISTANT_FORM_DRAFT_ENABLED:false}
      daily-quota: ${ASSISTANT_FORM_DRAFT_DAILY_QUOTA:30}
      max-turns: 8
  didit:
    base-url: ${DIDIT_BASE_URL:https://verification.didit.me}
    api-key: ${DIDIT_API_KEY:}
    workflow-id: ${DIDIT_WORKFLOW_ID:}
    webhook-secret: ${DIDIT_WEBHOOK_SECRET:}
    # live ou sandbox : un webhook portant un autre environnement est ignore, pour qu'un
    # test bac a sable ne puisse jamais verifier un compte de production.
    environment: ${DIDIT_ENVIRONMENT:live}
  stripe:
    connect:
      mcc: "4215"
      product-description: "Transport de colis entre particuliers via la plateforme Yadony"
      business-url: ${YADONY_STRIPE_CONNECT_BUSINESS_URL:https://yadony.com}
      # URL HTTPS, jamais le deep link : l'API AccountLink de Stripe refuse
      # tout schéma applicatif avec `url_invalid`, ce qui faisait échouer la création
      # de lien d'onboarding en production. Ces endpoints publics redirigent
      # ensuite vers le deep link (StripeOnboardingRedirectController), et
      # l'application intercepte de toute façon ces chemins dans sa webview.
      return-url: ${YADONY_STRIPE_CONNECT_RETURN_URL:https://api.yadony.com/api/v1/payments/onboarding/return}
      refresh-url: ${YADONY_STRIPE_CONNECT_REFRESH_URL:https://api.yadony.com/api/v1/payments/onboarding/refresh}
    webhook:
      poll-interval: 10s
      batch-size: 50
      max-retries: 8
      retry-backoff-base: 30s
      scheduler-enabled: true
  # Limites de débit applicatives (ratelimit/RateLimitRule) : par compte pour tout ce qui
  # est authentifié, par IP pour l'OTP. nginx ne garde qu'un plafond anti-flood large par
  # IP, à cause du CGNAT des opérateurs mobiles (des centaines d'abonnés derrière une IP).
  # Une règle se règle par yadony.rate-limit.rules.<nom>.limit|window (ex. payment-minute).
  rate-limit:
    enabled: ${YADONY_RATE_LIMIT_ENABLED:true}
    rules:
      account:
        limit: ${YADONY_RATE_LIMIT_ACCOUNT_PER_MINUTE:300}
      otp-send-ip:
        limit: ${YADONY_RATE_LIMIT_OTP_SEND_PER_IP:30}
      otp-verify-ip:
        limit: ${YADONY_RATE_LIMIT_OTP_VERIFY_PER_IP:60}
  referral:
    max-invitations-per-user: ${YADONY_REFERRAL_MAX_INVITATIONS_PER_USER:50}
    code-regeneration-cooldown-days: ${YADONY_REFERRAL_CODE_REGENERATION_COOLDOWN_DAYS:30}
    reward-wallet-amount: ${YADONY_REFERRAL_REWARD_WALLET_AMOUNT:5.00}
    reward-discount-percent: ${YADONY_REFERRAL_REWARD_DISCOUNT_PERCENT:5}
    reward-discount-validity-months: ${YADONY_REFERRAL_REWARD_DISCOUNT_VALIDITY_MONTHS:6}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  voucher:
    factor: ${YADONY_VOUCHER_FACTOR:0.50}
  requests:
    max-negotiation-rounds: ${YADONY_REQUESTS_MAX_NEGOTIATION_ROUNDS:5}
    thread-inactivity-hours: ${YADONY_REQUESTS_THREAD_INACTIVITY_HOURS:72}
    awaiting-trip-hours: ${YADONY_REQUESTS_AWAITING_TRIP_HOURS:12}
    awaiting-payment-hours: ${YADONY_REQUESTS_AWAITING_PAYMENT_HOURS:24}
    date-tolerance-default-days: ${YADONY_REQUESTS_DATE_TOLERANCE_DEFAULT_DAYS:2}
    date-tolerance-max-days: ${YADONY_REQUESTS_DATE_TOLERANCE_MAX_DAYS:7}
    weight-kg-min: ${YADONY_REQUESTS_WEIGHT_KG_MIN:0.5}
    weight-kg-max: ${YADONY_REQUESTS_WEIGHT_KG_MAX:32}
    body-max-chars: ${YADONY_REQUESTS_BODY_MAX_CHARS:280}
    max-open-requests-per-sender: ${YADONY_REQUESTS_MAX_OPEN_REQUESTS_PER_SENDER:10}
    max-open-threads-per-traveler: ${YADONY_REQUESTS_MAX_OPEN_THREADS_PER_TRAVELER:5}
    threads-per-minute-rate-limit: ${YADONY_REQUESTS_THREADS_PER_MINUTE_RATE_LIMIT:1}
    auto-expire-check-cron: "0 */15 * * * *"
    estimation-corridor-recent-trips: ${YADONY_REQUESTS_ESTIMATION_CORRIDOR_RECENT_TRIPS:20}
    estimation-cache-ttl-minutes: ${YADONY_REQUESTS_ESTIMATION_CACHE_TTL_MINUTES:60}
  matching:
    negotiation:
      max-rounds: ${YADONY_MATCHING_NEGOTIATION_MAX_ROUNDS:5}
      inactivity-hours: ${YADONY_MATCHING_NEGOTIATION_INACTIVITY_HOURS:72}
      awaiting-payment-hours: ${YADONY_MATCHING_NEGOTIATION_AWAITING_PAYMENT_HOURS:24}
      expire-check-cron: ${YADONY_MATCHING_NEGOTIATION_EXPIRE_CRON:0 */15 * * * *}
    # FLUTTER-GA : annulation des demandes non engagées à la date limite de dépôt du trajet.
    handover-deadline:
      expire-check-cron: ${YADONY_MATCHING_HANDOVER_DEADLINE_EXPIRE_CRON:0 */5 * * * *}
  negotiation:
    # Délai laissé au voyageur pour régler la commission Yadony d'un accord en
    # espèces avant que le thread expire et libère la demande (AWAITING_COMMISSION).
    commission-window-minutes: ${YADONY_NEGOTIATION_COMMISSION_WINDOW_MINUTES:120}
    # Profondeur d'historique du rattrapage des commissions débitées non
    # remboursées. Au-delà, un fil perdant n'est plus relu chez Stripe : une 3DS
    # abandonnée laisse un PaymentIntent qui n'atteint jamais succeeded, donc un
    # fil qui resterait éligible à vie et ferait grossir le balayage avec tout
    # l'historique de la plateforme.
    commission-refund-sweep-days: ${YADONY_NEGOTIATION_COMMISSION_REFUND_SWEEP_DAYS:7}
    # Balayage de l'expiration du délai de commission (toutes les 5 min, la
    # fenêtre par défaut étant de 2 h) + rattrapage des commissions débitées
    # jamais remboursées sur les fils perdants (AUTO_REJECTED/EXPIRED/CANCELLED).
    commission-expire-check-cron: ${YADONY_NEGOTIATION_COMMISSION_EXPIRE_CRON:0 */5 * * * *}
  pawapay:
    # Rail mobile money (deposits, payouts, refunds). Fermé par défaut : le rail n'est
    # proposé sur aucune annonce tant que PAWAPAY_ENABLED n'est pas true.
    enabled: ${PAWAPAY_ENABLED:false}
    base-url: ${PAWAPAY_BASE_URL:https://api.sandbox.pawapay.io}
    api-token: ${PAWAPAY_API_TOKEN:}
    # Obligatoire en prod (PawapayConfig refuse de démarrer sinon), activé aussi dans le
    # dashboard pawaPay (« Signed callbacks »).
    callback-signatures-required: ${PAWAPAY_CALLBACK_SIGNATURES:false}
    deposit-deadline-minutes: ${PAWAPAY_DEPOSIT_DEADLINE_MINUTES:30}
    # Page de rebond Wave (HTTPS, jamais le deep link : refusé par les PSP).
    return-base-url: ${PAWAPAY_RETURN_BASE_URL:https://api.yadony.com}
    deep-link-awaiting: ${PAWAPAY_DEEP_LINK_AWAITING:yadony://bids/%s/mobile-money/awaiting}
    deep-link-awaiting-thread: ${PAWAPAY_DEEP_LINK_AWAITING_THREAD:yadony://negotiations/%s/mobile-money/awaiting}
    # Écran d'attente du paiement d'un supplément de prix (bidId puis id du supplément).
    deep-link-awaiting-supplement: ${PAWAPAY_DEEP_LINK_AWAITING_SUPPLEMENT:yadony://bids/%s/supplements/%s/mobile-money/awaiting}
    # Recharge du portefeuille : écran unique, aucun identifiant à interpoler.
    deep-link-wallet: ${PAWAPAY_DEEP_LINK_WALLET:yadony://payments/wallet}
    poll-cron: ${PAWAPAY_POLL_CRON:0 */2 * * * *}
    balance-cron: ${PAWAPAY_BALANCE_CRON:0 15 * * * *}
    deadline-cron: ${PAWAPAY_DEADLINE_CRON:0 * * * * *}
    balance-min:
      xof: ${PAWAPAY_BALANCE_MIN_XOF:0}
      xaf: ${PAWAPAY_BALANCE_MIN_XAF:0}
    # Grille publique pawaPay (https://www.pawapay.io/fees, relevée le 18/10/2026) : frais
    # opérateur + 1 % pawaPay, débités du wallet Yadony en lignes séparées du relevé.
    # deposit-percent = encaissement ; refund-percent = taux de versement (pawaPay facture un
    # remboursement « 1 % + frais opérateur » sans publier la part opérateur). Vérifié en prod
    # le 18/10 : dépôt Orange CI de 500 XOF → 487 crédités (2,5 %). L'ancien barème 1 % + 1 %
    # renvoyait 490, plus que le wallet n'avait reçu : PAWAPAY_WALLET_OUT_OF_FUNDS.
    fees:
      default:
        deposit-percent: ${PAWAPAY_FEE_DEFAULT_DEPOSIT_PERCENT:2.5}
        refund-percent: ${PAWAPAY_FEE_DEFAULT_REFUND_PERCENT:2.0}
      providers:
        ORANGE_CIV: { deposit-percent: 2.5, refund-percent: 2.0 }
        MTN_MOMO_CIV: { deposit-percent: 1.8, refund-percent: 1.3 }
        MOOV_CIV: { deposit-percent: 1.8, refund-percent: 1.5 }
        WAVE_CIV: { deposit-percent: 2.0, refund-percent: 2.0 }
        ORANGE_SEN: { deposit-percent: 2.0, refund-percent: 1.8 }
        WAVE_SEN: { deposit-percent: 2.0, refund-percent: 2.0 }
        MTN_MOMO_CMR: { deposit-percent: 1.75, refund-percent: 1.3 }
        ORANGE_CMR: { deposit-percent: 1.77, refund-percent: 1.0 }
        MTN_MOMO_BEN: { deposit-percent: 2.2, refund-percent: 1.5 }
        MOOV_BEN: { deposit-percent: 2.2, refund-percent: 1.0 }
        MOOV_BFA: { deposit-percent: 3.0, refund-percent: 2.0 }
        # Versement Orange Burkina non proposé par pawaPay : taux de versement par défaut.
        ORANGE_BFA: { deposit-percent: 3.3, refund-percent: 2.0 }
    # Marge de sécurité (points de pourcentage) ajoutée au refund-percent de l'opérateur pour
    # calculer le montant qu'un remboursement ou un versement peut envoyer sans vider le wallet
    # pawaPay : maxSûr = floor(solde / (1 + (refund-percent + marge) / 100)).
    refund-safety-margin-percent: ${PAWAPAY_REFUND_SAFETY_MARGIN_PERCENT:1.0}
    # Indication de validation par opérateur (SMS_LINK | PIN_PROMPT | GENERIC), lue par
    # PawapayValidationHints. Opérateur absent ou valeur invalide = GENERIC. Seul cas constaté :
    # Orange CI envoie un SMS avec un lien à ouvrir. Syntaxe : littéral de map SpEL entre guillemets.
    validation-hints: "{ORANGE_CIV: 'SMS_LINK'}"
    # Pays annoncés « bientôt » dans le catalogue (GET /payments/mobile-money/countries) : codes ISO
    # alpha-2 séparés par des virgules. Un pays déjà ouvert chez pawaPay en est retiré automatiquement.
    upcoming-countries: ${PAWAPAY_UPCOMING_COUNTRIES:ML}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${YADONY_EMAIL_FROM_ADDRESS:noreply@yadony.com}
    # 5 envois / 5 min : le bouton « Renvoyer le code » de l'app se rouvre toutes
    # les 60 s, ce budget suit donc exactement ce que l'écran autorise à demander.
    max-sends-per-window: ${YADONY_EMAIL_OTP_MAX_SENDS:5}
    rate-window-minutes: ${YADONY_EMAIL_OTP_WINDOW_MINUTES:5}
    max-attempts: ${YADONY_EMAIL_OTP_MAX_ATTEMPTS:5}
    otp-valid-minutes: ${YADONY_EMAIL_OTP_VALID_MINUTES:10}
    # Codes par adresse sur 24 h, puis 1 par heure : borne le harcèlement d'une boîte sans
    # permettre de bloquer sa propriétaire 24 h.
    max-sends-per-day: ${YADONY_EMAIL_OTP_MAX_SENDS_PER_DAY:10}
    # Seuil d'ALERTE (Sentry) sur les envois par heure, toutes adresses confondues. Il ne
    # bloque pas : un arrosage depuis un botnet couperait sinon la connexion de tout le monde.
    max-sends-per-hour-global: ${YADONY_EMAIL_OTP_MAX_SENDS_PER_HOUR_GLOBAL:1000}
    # Plafond dur (503) : 5 fois le seuil d'alerte, pour le seul abus massif (quota Resend).
    hard-max-sends-per-hour-global: ${YADONY_EMAIL_OTP_HARD_MAX_SENDS_PER_HOUR_GLOBAL:5000}
  sms:
    # Mêmes valeurs que le canal email : l'écran de saisie du code est partagé
    # entre les deux, son bouton « Renvoyer » se rouvrant toutes les 60 s.
    max-sends-per-window: ${YADONY_SMS_OTP_MAX_SENDS:5}
    rate-window-minutes: ${YADONY_SMS_OTP_WINDOW_MINUTES:5}
    max-attempts: ${YADONY_SMS_OTP_MAX_ATTEMPTS:5}
    otp-valid-minutes: ${YADONY_SMS_OTP_VALID_MINUTES:10}
    max-sends-per-day: ${YADONY_SMS_OTP_MAX_SENDS_PER_DAY:10}
    # Connexions réussies par numéro sur la fenêtre, même avec un bon code.
    max-logins-per-window: ${YADONY_SMS_OTP_MAX_LOGINS_PER_WINDOW:3}
    login-window-minutes: ${YADONY_SMS_OTP_LOGIN_WINDOW_MINUTES:10}
    # Anti SMS pumping : seuls ces indicatifs reçoivent un code (diaspora Europe/Amérique
    # du Nord, corridors Afrique de l'Ouest et centrale, Maghreb). Vide = tous les pays.
    allowed-country-codes: ${YADONY_SMS_OTP_ALLOWED_COUNTRY_CODES:33,32,41,352,49,39,34,351,44,31,1,221,225,223,237,224,226,227,228,229,241,242,243,222,235,236,212,213,216}
    # Exclus même si l'indicatif est autorisé : zones caraïbes du plan +1 (pumping fréquent).
    denied-prefixes: ${YADONY_SMS_OTP_DENIED_PREFIXES:1242,1246,1264,1268,1284,1345,1441,1473,1649,1658,1664,1721,1758,1767,1784,1809,1829,1849,1868,1869,1876}
    # SMS de code par heure et par 24 h, tous numéros confondus ; au-delà 503 + alerte.
    # Bloquant exprès : chaque SMS est facturé, et l'email reste disponible.
    max-sends-per-hour-global: ${YADONY_SMS_OTP_MAX_SENDS_PER_HOUR_GLOBAL:200}
    max-sends-per-day-global: ${YADONY_SMS_OTP_MAX_SENDS_PER_DAY_GLOBAL:1000}
    # Comptes de démo pour la review des stores, « +E164:code » séparés par des virgules :
    # aucun SMS, code fixe accepté. Vide par défaut, à vider après la review.
    review-accounts: ${YADONY_SMS_OTP_REVIEW_ACCOUNTS:}
    # Empreintes SMS Retriever de l'app Android, séparées par des virgules (debug, clé de
    # signature Play). Ajoutées à la fin du SMS de code : Android remet alors le SMS à
    # l'app, qui remplit le code toute seule. Vide = SMS inchangé.
    android-app-hashes: ${ANDROID_SMS_APP_HASHES:}

# Encryption (AES-256 for KYC sensitive data)
app:
  encryption:
    key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (32-byte base64 or strong passphrase)}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Base à laquelle PublicAnnouncementPageController accroche « /annonce/{id} ».
  #
  # Distincte de base-url ci-dessus, qui s'arrête à l'hôte : les appelants
  # existants (TrackingService, RecipientController) recollent « /api/v1 » à la
  # main. Repli par défaut = origine API + /api/v1 : une URL correcte et
  # directement joignable sans nginx (dev, staging tant que non configuré),
  # au prix de rester visiblement technique. Le jour du domaine court, la
  # surcharger avec le domaine NU (sans /api/v1, ex. https://yadony.com) la
  # rend pleinement lisible — à condition que nginx porte la règle de
  # réécriture correspondante (voir nginx/nginx.conf), sinon 404. Une URL
  # imprimée sur une affiche postée sur Facebook n'est plus rappelable, elle
  # doit donc être correcte du premier coup et déplaçable d'un bloc — d'où une
  # variable dédiée, surchargeable seule, sans invalider les affiches déjà
  # publiées.
  public-base-url: ${PUBLIC_BASE_URL:${APP_BASE_URL:http://localhost:8080}/api/v1}
  # Fiches stores, affichées sur la page publique d'une annonce (/annonce/{id}).
  # Vides par défaut : l'application n'est pas encore publiée, et un bouton
  # pointant vers une fiche inexistante coûte plus cher qu'un bouton absent.
  # Le gabarit ne rend chaque bouton que si l'URL correspondante est renseignée.
  store:
    android: ${STORE_URL_ANDROID:}
    ios: ${STORE_URL_IOS:}
    # Feature flag : le bouton principal de la page ouvre le store du bon
    # système (Android/iOS détecté au User-Agent) plutôt que le lien yadony://.
    # Faux par défaut — l'application n'est pas encore publiée, un bouton
    # store pointerait vers rien. À activer le jour du lancement, en même
    # temps que les deux URL ci-dessus.
    #
    # Lu en String, pas en boolean, et converti côté Java : le défaut YAML ne
    # couvre que la variable ABSENTE. Le workflow de déploiement écrit
    # `STORE_OS_REDIRECT_ENABLED=` dans le .env tant que la variable GitHub
    # n'existe pas — définie mais vide. Spring échouerait alors à convertir
    # «  » en booléen et l'application REFUSERAIT DE DÉMARRER
    # (Invalid boolean value []). Cf. PublicAnnouncementPageController.
    os-redirect-enabled: ${STORE_OS_REDIRECT_ENABLED:false}
  sms:
    enabled: ${SMS_ENABLED:false}
    africastalking:
      api-key: ${AT_API_KEY:}
      username: ${AT_USERNAME:sandbox}
      # SN, CI, ML, CM — cf. SmsService.isAfricasTalkingCorridor(). Tout autre
      # indicatif (France comprise) part directement sur Twilio.
      corridor-calling-codes: ${AT_CORRIDOR_CALLING_CODES:221,225,223,237}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
      # Twilio Verify, pour les indicatifs où un SMS depuis notre numéro est bloqué par les
      # opérateurs (États-Unis/Canada : enregistrement A2P 10DLC exigé). Vide = désactivé,
      # tous les numéros gardent la route SMS classique.
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
      verify-calling-codes: ${TWILIO_VERIFY_CALLING_CODES:1}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    # Autocomplétion mondiale : la liste blanche de pays est levée. L'ancienne
    # liste (22 pays) dépassait de toute façon le plafond Google Places de 15
    # region codes : MA, DZ, TN, MG, RE, MU, GP et MQ étaient silencieusement
    # ignorés, et la diaspora hors corridors (US, CA…) ne trouvait pas ses
    # adresses. Le biais de proximité (cercle 50 km autour de la position)
    # continue de favoriser les résultats locaux. Surchargable via
    # APP_PLACES_ALLOWED_COUNTRIES si une restriction redevient nécessaire.
    allowed-countries: ${APP_PLACES_ALLOWED_COUNTRIES:}
    # Biais de proximité désactivé par défaut : laisse remonter les villes du
    # monde entier (Toronto, etc.). Réactivable via APP_PLACES_LOCATION_BIAS_ENABLED.
    location-bias-enabled: ${APP_PLACES_LOCATION_BIAS_ENABLED:false}
    rate-limit-per-minute: ${APP_PLACES_RATE_LIMIT_PER_MINUTE:100}
    daily-quota-autocomplete: ${APP_PLACES_DAILY_QUOTA_AUTOCOMPLETE:5000}
    daily-quota-details: ${APP_PLACES_DAILY_QUOTA_DETAILS:1000}
    daily-quota-reverse: ${APP_PLACES_DAILY_QUOTA_REVERSE:500}
    block-when-quota-exceeded: ${APP_PLACES_BLOCK_WHEN_QUOTA_EXCEEDED:true}

  alerts:
    digest-cron: "0 0 9 * * *"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  # Relances réseau du SDK (Connection reset, timeout) : même clé d'idempotence à chaque relance.
  max-network-retries: ${STRIPE_MAX_NETWORK_RETRIES:2}
  fx-quotes:
    api-version: ${STRIPE_FX_QUOTES_API_VERSION:2025-03-31.preview}
    lock-duration: ${STRIPE_FX_QUOTES_LOCK_DURATION:hour}
    fallback-ttl: ${STRIPE_FX_QUOTES_FALLBACK_TTL:PT1H}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  webhook:
    payments-secret: ${STRIPE_WEBHOOK_PAYMENTS_SECRET:${STRIPE_WEBHOOK_SECRET:}}
    kyc-secret: ${STRIPE_WEBHOOK_KYC_SECRET:${STRIPE_WEBHOOK_SECRET:}}
    billing-secret: ${STRIPE_WEBHOOK_BILLING_SECRET:${STRIPE_WEBHOOK_SECRET:}}
    # Endpoint « comptes connectés » (même URL que les paiements, autre secret). Vide = absent.
    connect-secret: ${STRIPE_WEBHOOK_CONNECT_SECRET:}

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://yadony-storage.local}
