spring:
  application:
    name: yadony-back
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson — camelCase + ISO 8601 UTC
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # Security
  security:
    user:
      name: disabled
      password: disabled

  # Multipart upload (Spring's defaults are 1 MB / 10 MB which truncate
  # photos coming from mobile cameras — bumped to match StorageService.MAX_FILE_SIZE)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Server
server:
  servlet:
    context-path: /api/v1
  port: 8080
  error:
    whitelabel:
      enabled: false
  # Tomcat enforces its own multipart limits before Spring sees the request.
  # Default 2 MB rejects mobile photos silently — bumped to match StorageService.
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      # Spring Boot 3.5+: use `access` only — `enabled` is mutually exclusive.
      # Prometheus is scraped by the internal monitoring stack.
      # NOT in SecurityConfig permitAll — scraper must authenticate or be
      # isolated at the network level (Nginx/firewall).
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    port: 8080

# OpenAPI / Swagger — disabled by default, enabled only in dev profile
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  packages-to-scan: com.yadony.api

# Logging
logging:
  level:
    com.yadony.api: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

# Yadony business config
# Toutes les valeurs métier sont surchargeables par variable d'environnement
# (${VAR:défaut}) — provisioning prod sans rebuild.
yadony:
  admin:
    bootstrap:
      secret: ${ADMIN_BOOTSTRAP_SECRET:}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  commission:
    rate: ${YADONY_COMMISSION_RATE:0.05}
    minimum-amount: ${YADONY_COMMISSION_MINIMUM_AMOUNT:1.00}
    no-show-contestation-hours: ${YADONY_COMMISSION_NO_SHOW_CONTESTATION_HOURS:24}
  urgency:
    threshold-days: ${YADONY_URGENCY_THRESHOLD_DAYS:3}
  cash-commission:
    orphan-pi-cleanup-cron: "0 */15 * * * *"
    orphan-pi-timeout-minutes: 30
    no-show-timeout-cron: "0 0 * * * *"
    card-expiration-warning-days: 30
  cancellation:
    return-deadline-cron: "0 0 * * * *"
  limits:
    non-pro:
      monthly-announcements: ${YADONY_LIMITS_NON_PRO_MONTHLY_ANNOUNCEMENTS:2}
  escrow-timeout-hours: ${YADONY_ESCROW_TIMEOUT_HOURS:48}
  dispute-sla-hours: ${YADONY_DISPUTE_SLA_HOURS:72}
  reimbursement:
    max-amount-eur: ${YADONY_REIMBURSEMENT_MAX_AMOUNT_EUR:50}
  kyc:
    return-url: ${YADONY_KYC_RETURN_URL:https://yadony.com/kyc/complete}
  stripe:
    connect:
      mcc: "4215"
      product-description: "Transport de colis entre particuliers via la plateforme Yadony"
      business-url: ${YADONY_STRIPE_CONNECT_BUSINESS_URL:https://yadony.com}
      return-url: "yadony://stripe/onboarding/complete"
      refresh-url: "yadony://stripe/onboarding/refresh"
    webhook:
      poll-interval: 10s
      batch-size: 50
      max-retries: 8
      retry-backoff-base: 30s
      scheduler-enabled: true
  referral:
    reward-amount-cents: ${YADONY_REFERRAL_REWARD_AMOUNT_CENTS:500}
    max-invitations-per-user: ${YADONY_REFERRAL_MAX_INVITATIONS_PER_USER:50}
    code-regeneration-cooldown-days: ${YADONY_REFERRAL_CODE_REGENERATION_COOLDOWN_DAYS:30}
  requests:
    max-negotiation-rounds: ${YADONY_REQUESTS_MAX_NEGOTIATION_ROUNDS:5}
    thread-inactivity-hours: ${YADONY_REQUESTS_THREAD_INACTIVITY_HOURS:72}
    awaiting-trip-hours: ${YADONY_REQUESTS_AWAITING_TRIP_HOURS:12}
    awaiting-payment-hours: ${YADONY_REQUESTS_AWAITING_PAYMENT_HOURS:24}
    date-tolerance-default-days: ${YADONY_REQUESTS_DATE_TOLERANCE_DEFAULT_DAYS:2}
    date-tolerance-max-days: ${YADONY_REQUESTS_DATE_TOLERANCE_MAX_DAYS:7}
    weight-kg-min: ${YADONY_REQUESTS_WEIGHT_KG_MIN:0.5}
    weight-kg-max: ${YADONY_REQUESTS_WEIGHT_KG_MAX:32}
    body-max-chars: ${YADONY_REQUESTS_BODY_MAX_CHARS:280}
    max-open-requests-per-sender: ${YADONY_REQUESTS_MAX_OPEN_REQUESTS_PER_SENDER:10}
    max-open-threads-per-traveler: ${YADONY_REQUESTS_MAX_OPEN_THREADS_PER_TRAVELER:5}
    threads-per-minute-rate-limit: ${YADONY_REQUESTS_THREADS_PER_MINUTE_RATE_LIMIT:1}
    auto-expire-check-cron: "0 */15 * * * *"
    estimation-corridor-recent-trips: ${YADONY_REQUESTS_ESTIMATION_CORRIDOR_RECENT_TRIPS:20}
    estimation-cache-ttl-minutes: ${YADONY_REQUESTS_ESTIMATION_CACHE_TTL_MINUTES:60}
  mobilemoney:
    wave:
      api-key: ${WAVE_API_KEY:}
      api-url: ${WAVE_API_URL:https://api.wave.com/v1}
      webhook-secret: ${WAVE_WEBHOOK_SECRET:}
    orange-money:
      api-key: ${ORANGE_MONEY_API_KEY:}
      api-url: ${ORANGE_MONEY_API_URL:https://api.orange.com/orange-money-webpay/v1}
      webhook-secret: ${ORANGE_MONEY_WEBHOOK_SECRET:}
    link-expiry-minutes: ${YADONY_MOBILEMONEY_LINK_EXPIRY_MINUTES:30}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${YADONY_EMAIL_FROM_ADDRESS:noreply@yadony.com}
    otp-template: "Ton code Yadony est : %s. Valable 10 minutes."
    # 5 envois / 5 min : le bouton « Renvoyer le code » de l'app se rouvre toutes
    # les 60 s, ce budget suit donc exactement ce que l'écran autorise à demander.
    max-sends-per-window: ${YADONY_EMAIL_OTP_MAX_SENDS:5}
    rate-window-minutes: ${YADONY_EMAIL_OTP_WINDOW_MINUTES:5}
    max-attempts: ${YADONY_EMAIL_OTP_MAX_ATTEMPTS:5}
    otp-valid-minutes: ${YADONY_EMAIL_OTP_VALID_MINUTES:10}
  sms:
    otp-template: "Ton code Yadony est : %s. Valable 10 minutes."

# Encryption (AES-256 for KYC sensitive data)
app:
  encryption:
    key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (32-byte base64 or strong passphrase)}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  sms:
    enabled: ${SMS_ENABLED:false}
    africastalking:
      api-key: ${AT_API_KEY:}
      username: ${AT_USERNAME:sandbox}
      # SN, CI, ML, CM — cf. SmsService.isAfricasTalkingCorridor(). Tout autre
      # indicatif (France comprise) part directement sur Twilio.
      corridor-calling-codes: ${AT_CORRIDOR_CALLING_CODES:221,225,223,237}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    allowed-countries: FR,SN,CI,ML,CM,GN,BF,TG,BJ,NE,MR,CD,CG,GA,TD,MA,DZ,TN,MG,RE,MU,GP,MQ
    rate-limit-per-minute: ${APP_PLACES_RATE_LIMIT_PER_MINUTE:100}
    daily-quota-autocomplete: ${APP_PLACES_DAILY_QUOTA_AUTOCOMPLETE:5000}
    daily-quota-details: ${APP_PLACES_DAILY_QUOTA_DETAILS:1000}
    daily-quota-reverse: ${APP_PLACES_DAILY_QUOTA_REVERSE:500}
    block-when-quota-exceeded: ${APP_PLACES_BLOCK_WHEN_QUOTA_EXCEEDED:true}

  alerts:
    digest-cron: "0 0 9 * * *"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  fx-quotes:
    api-version: ${STRIPE_FX_QUOTES_API_VERSION:2025-03-31.preview}
    lock-duration: ${STRIPE_FX_QUOTES_LOCK_DURATION:hour}
    fallback-ttl: ${STRIPE_FX_QUOTES_FALLBACK_TTL:PT1H}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  webhook:
    payments-secret: ${STRIPE_WEBHOOK_PAYMENTS_SECRET:${STRIPE_WEBHOOK_SECRET:}}
    kyc-secret: ${STRIPE_WEBHOOK_KYC_SECRET:${STRIPE_WEBHOOK_SECRET:}}

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://yadony-storage.local}
