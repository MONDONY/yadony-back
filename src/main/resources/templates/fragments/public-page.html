<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--
  Charpente commune des pages publiques (suivi destinataire, scan du QR, trajet et
  demande partagés), même direction que les e-mails : filet bleu en haut, logo
  centré, cartes blanches à bordure fine, un chiffre par case pour les codes.
  Polices et couleurs = celles de l'app (lib/core/design/tokens/), aplats seulement.
-->
<head>
  <th:block th:fragment="head">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #FAFAF8;
        --surface: #FFFFFF;
        --line: #E8E5DF;
        --ink: #0A2540;
        --muted: #54504A;
        --subtle: #797367;
        --blue: #0B5FFF;
        --blue-press: #083CAB;
        --blue-soft: #EDF2FF;
        --blue-edge: #D6E1FF;
        --blue-deep: #062B7D;
        --terra: #D96A3A;
        --success: #0C7A54;
        --success-soft: #E5F4EE;
        --danger: #B3261E;
        --whatsapp: #128C4A;
        --f-display: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        --f-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 15px;
        line-height: 1.5;
        border-top: 6px solid var(--blue);
      }
      .page {
        width: min(100%, 480px);
        margin: 0 auto;
        padding: 28px 16px 40px;
        display: grid;
        gap: 12px;
      }
      .brand { display: flex; justify-content: center; margin-bottom: 12px; }
      .brand img { height: 28px; width: auto; display: block; }

      .hero { text-align: center; display: grid; gap: 6px; justify-items: center; margin-bottom: 8px; }
      .hero h1 {
        margin: 0;
        font-family: var(--f-display);
        font-size: 28px; font-weight: 800; line-height: 1.2; letter-spacing: -0.5px;
        text-wrap: balance;
      }
      .hero p { margin: 0; color: var(--muted); max-width: 36ch; text-wrap: pretty; }
      .arrow { color: var(--subtle); font-weight: 400; margin: 0 6px; }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      .card h2 { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 800; }
      .card p { margin: 0; color: var(--muted); text-wrap: pretty; }
      .label {
        margin: 0;
        color: var(--subtle);
        font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .muted { color: var(--muted); font-size: 13px; }

      .chip {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--blue-deep);
        font-size: 13px; font-weight: 700;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      .chip.neutral { background: var(--bg); color: var(--ink); border: 1px solid var(--line); letter-spacing: 0; font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }

      .status-pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 14px; border-radius: 999px;
        background: var(--blue-soft); color: var(--blue-deep);
        font-weight: 700; font-size: 14px;
      }
      .status-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
      .status-pill.done { background: var(--success-soft); color: var(--success); }
      .status-pill.done::before { background: var(--success); }

      /* Lignes libellé / valeur : la valeur passe à la ligne plutôt que d'élargir la page. */
      .rows { margin: 0; display: grid; }
      .row {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line);
      }
      .row:first-child { padding-top: 0; }
      .row:last-child { border-bottom: 0; padding-bottom: 0; }
      .row dt { color: var(--muted); font-size: 14px; margin: 0; white-space: nowrap; }
      .row dd { margin: 0; font-weight: 600; font-size: 14px; text-align: right; min-width: 0; overflow-wrap: anywhere; }

      /* Un chiffre par case, comme l'écran de saisie du code dans l'app et le mail. */
      .digits { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
      .digit {
        width: 44px; height: 56px;
        display: grid; place-items: center;
        background: var(--blue-soft);
        border: 1px solid var(--blue-edge);
        border-radius: 10px;
        color: var(--blue-deep);
        font-family: var(--f-display); font-size: 28px; font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      /* Frise des étapes : point plein pour chaque scan enregistré. */
      .timeline { display: grid; }
      .step { display: grid; grid-template-columns: 20px 1fr; gap: 12px; }
      .step .rail { position: relative; display: flex; justify-content: center; }
      .step .rail::before { content: ""; width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--blue-soft); }
      .step:not(:last-child) .rail::after { content: ""; position: absolute; top: 22px; bottom: 0; width: 2px; background: var(--blue-edge); }
      .step .body { display: grid; gap: 2px; padding-bottom: 18px; min-width: 0; }
      .step:last-child .body { padding-bottom: 0; }
      .step strong { font-size: 15px; }
      .step time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      .step img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-top: 8px; display: block; border: 1px solid var(--line); }

      .btn {
        display: block; width: 100%; padding: 15px;
        border-radius: 14px; border: 1px solid transparent;
        font-family: inherit; font-size: 15px; font-weight: 700; text-align: center;
        text-decoration: none; cursor: pointer;
        transition: transform 120ms ease, background-color 120ms ease;
      }
      .btn:active { transform: scale(0.97); }
      .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .btn-primary { background: var(--blue); color: #FFFFFF; }
      .btn-primary:active { background: var(--blue-press); }
      .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
      .btn-whatsapp { background: var(--whatsapp); color: #FFFFFF; }
      .actions { display: grid; gap: 10px; margin-top: 4px; }

      .trust { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--subtle); font-weight: 600; }
      .note { margin: 0; text-align: center; font-size: 12px; color: var(--subtle); text-wrap: pretty; }
      .foot { margin: 16px 0 0; text-align: center; font-size: 12px; color: var(--subtle); }

      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
      @media (max-width: 380px) {
        .digit { width: 38px; height: 50px; font-size: 24px; }
        .hero h1 { font-size: 24px; }
      }
    </style>
  </th:block>
</head>
<body>
  <!-- Bandeau de marque : filet bleu (bordure du body) puis logo centré. -->
  <div class="brand" th:fragment="brand">
    <img src="/logo.png" alt="Yadony" width="103" height="28">
  </div>
</body>
</html>
