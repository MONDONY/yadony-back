# Enable Swagger UI only in dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/yadony_dev}
    username: ${POSTGRES_USER:yadony}
    password: ${POSTGRES_PASSWORD:yadony_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: true

  # Dev partage une seule DB entre branches feature : tolere les migrations appliquees
  # par une branche soeur mais absentes de la branche courante (ex. V147 disputes admin).
  # N'affecte QUE le profil dev - la prod garde la validation stricte.
  flyway:
    ignore-migration-patterns: "*:missing"

# Sentry disabled in dev by default (opt-in via SENTRY_ENABLED=true if needed locally)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: dev
  enabled: ${SENTRY_ENABLED:false}

# Cloudflare R2 (S3-compatible)
aws:
  s3:
    region: ${AWS_S3_REGION}
    bucket: ${AWS_S3_BUCKET}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    endpoint: ${AWS_S3_ENDPOINT:}

# Stripe (test keys — définir STRIPE_SECRET_KEY et STRIPE_WEBHOOK_SECRET dans les variables d'env)
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  # Kept for backwards compatibility with existing Stripe CLI local testing scripts
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_local}
  webhook:
    payments-secret: ${STRIPE_WEBHOOK_PAYMENTS_SECRET:${STRIPE_WEBHOOK_SECRET:whsec_local}}
    kyc-secret: ${STRIPE_WEBHOOK_KYC_SECRET:${STRIPE_WEBHOOK_SECRET:whsec_local}}

# Firebase
firebase:
  service-account-path: classpath:firebase-service-account.json
  # Web API Key — requis pour GET /dev/token (Firebase Console > Paramètres du projet > Général > Clé d'API Web)
  web-api-key: ${FIREBASE_API_KEY:}

yadony:
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${YADONY_EMAIL_FROM_ADDRESS:noreply@yadony.com}
    otp-template: "Ton code Yadony est : %s. Valable 10 minutes."
  kyc:
    enforce: false
    return-url: "https://yadony.com/kyc/complete"
  stripe:
    enforce: false
    connect:
      mcc: "4215"
      product-description: "Transport de colis entre particuliers via la plateforme Yadony"
      business-url: "https://yadony.com"
      # Stripe n'accepte pas les deep links (yadony://) — on passe par des endpoints HTTP intermédiaires
      # Émulateur Android : 10.0.2.2 = localhost machine. Appareil physique : remplacer par l'IP locale
      return-url: "http://10.0.2.2:8080/api/v1/payments/onboarding/return"
      refresh-url: "http://10.0.2.2:8080/api/v1/payments/onboarding/refresh"
      deep-link-return: "yadony://stripe/onboarding/complete"
      deep-link-refresh: "yadony://stripe/onboarding/refresh"
  internal:
    secret: ${INTERNAL_SHARED_SECRET:local-dev-secret-change-me}
  admin:
    bootstrap:
      secret: ${ADMIN_BOOTSTRAP_SECRET:yadony-admin-bootstrap-dev}
  dev:
    auth-bypass: true
    # Jeton du bypass dev — surchargeable via env YADONY_DEV_BYPASS_TOKEN.
    # Actif uniquement hors prod ET depuis la loopback (voir FirebaseTokenFilter).
    bypass-token: ${YADONY_DEV_BYPASS_TOKEN:dev-super-admin}

logging:
  level:
    com.yadony.api: DEBUG
    org.springframework.security: DEBUG

app:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    allowed-countries: ""
    rate-limit-per-minute: 200
    daily-quota-autocomplete: 10000
    daily-quota-details: 2000
    daily-quota-reverse: 1000
    block-when-quota-exceeded: false

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://yadony-storage.local}
